<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Stock Examples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .main-layout {
            display: flex;
            gap: 20px;
        }

        .content-container {
            width: max-content;
            background-color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-height: 80vh;
        }

        button {
            font-size: 14px;
            padding: 6px 16px;
            cursor: pointer;
            margin-bottom: 0;
        }

        .list-item {
            font-size: 14px;
            color: #0000ee;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font-weight: normal;
            white-space: nowrap;
        }

        .list-item:hover {
            color: #0000ee;
            text-decoration: underline;
        }

        .list-item.active {
            color: red;
            text-decoration: underline;
            font-weight: normal;
        }

        #section-list, #classification-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        #edit-sections-btn, #edit-classifications-btn {
            margin-bottom: 20px;
        }

        .content-container h3 {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #current-classification-title {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #example-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        a, span.example-text {
            font-size: 14px;
            text-decoration: none;
            text-align: left;
            white-space: nowrap;
        }

        a {
            color: #0000ee;
        }

        a:hover {
            text-decoration: underline;
        }

        span.example-text {
            color: #000000;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: fit-content;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .table-wrapper {
            overflow-y: auto;
            flex-grow: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }

        .link-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .link-table th, .link-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        .link-table th {
            background-color: #f2f2f2;
        }

        .edit-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 4px;
        }

        .edit-btn:hover {
            background-color: #0b7dda;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 0;
        }

        .delete-btn:hover {
            background-color: #cc0000;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .add-form input, .add-form select {
            padding: 6px;
            font-size: 14px;
        }

        .add-form button {
            margin-bottom: 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
        }

        .add-form button:hover {
            background-color: #45a049;
        }

        tr.draggable {
            cursor: grab;
        }
        tr.draggable:active {
            cursor: grabbing;
        }
        tr.dragging {
            opacity: 0.5;
            background-color: #e0e0e0;
        }
        .classification-select, .section-select {
            width: 100%;
            padding: 4px;
            font-size: 14px;
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Auth Form Styles */
        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-box h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-align: center;
        }

        .login-box input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-box button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
        }

        .logout-btn {
            background-color: #757575;
            color: white;
            border: none;
            border-radius: 4px;
        }

        #auth-error {
            color: red;
            font-size: 12px;
            margin: 0;
            display: none;
        }
    </style>
</head>
<body>

<!-- Login Modal -->
<div class="modal-overlay" id="login-overlay" style="display: flex;">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input type="email" id="login-email" placeholder="Email" autocomplete="username">
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
        <button id="login-btn">Sign In</button>
        <p id="auth-error"></p>
    </div>
</div>

<!-- Main App Layout -->
<div id="admin-app" style="display: none;">
    <div class="header-bar">
        <span>Logged in as Admin</span>
        <div style="display: flex; gap: 8px;">
            <button class="logout-btn" onclick="window.open('stocksexamples.html', '_blank')">View Public Page</button>
            <button class="logout-btn" id="logout-btn">Log Out</button>
        </div>
    </div>

    <div class="main-layout">
        <!-- Sections Column -->
        <div class="content-container">
            <button id="edit-sections-btn">Manage Sections</button>
            <h3>Sections</h3>
            <div id="section-list"></div>
        </div>

        <!-- Classifications Column -->
        <div class="content-container" id="classifications-container">
            <button id="edit-classifications-btn">Manage Classifications</button>
            <h3>Classifications</h3>
            <div id="classification-list"></div>
        </div>

        <!-- Examples Column -->
        <div class="content-container right-container">
            <div class="button-row">
                <button id="edit-examples-btn">Manage Examples</button>
            </div>
            <h3 id="current-classification-title">Examples</h3>
            <div id="example-list"></div>
        </div>
    </div>
</div>

<!-- Manage Examples Modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Manage Examples</h3>
            <button class="close-btn" id="close-modal-btn">&times;</button>
        </div>

        <div class="table-wrapper">
            <table class="link-table">
                <thead>
                    <tr>
                        <th>Text</th>
                        <th>URL (Optional)</th>
                        <th>Classification</th>
                        <th style="width: 120px;">Action</th>
                    </tr>
                </thead>
                <tbody id="modal-table-body"></tbody>
            </table>
        </div>

        <div class="add-form">
            <input type="text" id="new-text" placeholder="Display Text">
            <input type="text" id="new-url" placeholder="URL (Optional - leave blank if none)">
            <select id="new-classification"></select>
            <button id="add-example-btn">Add New Example</button>
        </div>
    </div>
</div>

<!-- Manage Classifications Modal -->
<div class="modal-overlay" id="classification-modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Manage Classifications</h3>
            <button class="close-btn" id="close-classification-modal-btn">&times;</button>
        </div>

        <div class="table-wrapper">
            <table class="link-table">
                <thead>
                    <tr>
                        <th>Classification Name</th>
                        <th>Section</th>
                        <th style="width: 120px;">Action</th>
                    </tr>
                </thead>
                <tbody id="classification-table-body"></tbody>
            </table>
        </div>

        <div class="add-form">
            <input type="text" id="new-classification-name" placeholder="New Classification Name">
            <select id="new-classification-section"></select>
            <button id="add-classification-btn">Add Classification</button>
        </div>
    </div>
</div>

<!-- Manage Sections Modal -->
<div class="modal-overlay" id="section-modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Manage Sections</h3>
            <button class="close-btn" id="close-section-modal-btn">&times;</button>
        </div>

        <div class="table-wrapper">
            <table class="link-table">
                <thead>
                    <tr>
                        <th>Section Name</th>
                        <th style="width: 120px;">Action</th>
                    </tr>
                </thead>
                <tbody id="section-table-body"></tbody>
            </table>
        </div>

        <div class="add-form">
            <input type="text" id="new-section-name" placeholder="New Section Name">
            <button id="add-section-btn">Add Section</button>
        </div>
    </div>
</div>

<!-- Firebase SDK Imports & Main Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { 
        initializeFirestore, 
        persistentLocalCache, 
        persistentMultipleTabManager, 
        doc, 
        setDoc, 
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBgDtEmsmmglLcx6BbzR-IfFZ31duTPOag",
        authDomain: "toc-app-3ffe0.firebaseapp.com",
        projectId: "toc-app-3ffe0",
        storageBucket: "toc-app-3ffe0.firebasestorage.app",
        messagingSenderId: "1047075984315",
        appId: "1:1047075984315:web:8ddf68765cbef4efb2ea9e",
        measurementId: "G-H7677BPJ4G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, {
        localCache: persistentLocalCache({
            tabManager: persistentMultipleTabManager()
        })
    });
    const docRef = doc(db, "app_data", "stocks_state");

    let sections = ["Miscellaneous"];
    let classifications = [{ name: "Miscellaneous", section: "Miscellaneous" }];
    let examples = [];

    let selectedSection = "Miscellaneous";
    let selectedClassification = "Miscellaneous";

    const loginOverlay = document.getElementById('login-overlay');
    const adminApp = document.getElementById('admin-app');
    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const authError = document.getElementById('auth-error');

    loginBtn.addEventListener('click', async () => {
        const email = loginEmailInput.value.trim();
        const password = loginPasswordInput.value.trim();
        authError.style.display = 'none';

        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            authError.textContent = "Invalid login credentials.";
            authError.style.display = 'block';
        }
    });

    logoutBtn.addEventListener('click', () => {
        signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginOverlay.style.display = 'none';
            adminApp.style.display = 'block';
            initRealtimeSync();
        } else {
            loginOverlay.style.display = 'flex';
            adminApp.style.display = 'none';
        }
    });

    function sortExamplesArray() {
    examples.sort((a, b) => {
        const getYear = (str) => {
            const match = str.match(/(\d{4})\s*$/);
            return match ? parseInt(match[1], 10) : 0;
        };
        const yearA = getYear(a.text);
        const yearB = getYear(b.text);
        if (yearB !== yearA) {
            return yearB - yearA; // Most recent year on top
        }
        return a.text.localeCompare(b.text); // Alphabetical if same year
    });
    }

    async function saveData() {
        try {
            const payload = { sections, classifications, examples };
            await setDoc(docRef, payload, { merge: true });
        } catch (e) {
            console.error("Error writing document to Firebase: ", e);
            alert("Error saving: You may not have write permission.");
        }
    }

    function initRealtimeSync() {
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                sections = data.sections || ["Miscellaneous"];
                classifications = data.classifications || [{ name: "Miscellaneous", section: "Miscellaneous" }];
                examples = data.examples || [];
                sortExamplesArray();

                if (!sections.includes(selectedSection)) {
                    selectedSection = sections[0] || "Miscellaneous";
                }

                const availableClassifications = classifications.filter(ch => ch.section === selectedSection);
                if (!availableClassifications.some(ch => ch.name === selectedClassification)) {
                    selectedClassification = availableClassifications[0] ? availableClassifications[0].name : "";
                }

                renderAll();
            } else if (!docSnap.metadata.fromCache) {
                saveData();
            }
        });
    }

    const editExamplesBtn = document.getElementById('edit-examples-btn');
    const exampleList = document.getElementById('example-list');
    const modalOverlay = document.getElementById('modal-overlay');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const modalTableBody = document.getElementById('modal-table-body');
    const addExampleBtn = document.getElementById('add-example-btn');
    const newTextInput = document.getElementById('new-text');
    const newUrlInput = document.getElementById('new-url');

    const editClassificationsBtn = document.getElementById('edit-classifications-btn');
    const classificationModalOverlay = document.getElementById('classification-modal-overlay');
    const closeClassificationModalBtn = document.getElementById('close-classification-modal-btn');
    const classificationTableBody = document.getElementById('classification-table-body');
    const addClassificationBtn = document.getElementById('add-classification-btn');

    const editSectionsBtn = document.getElementById('edit-sections-btn');
    const sectionModalOverlay = document.getElementById('section-modal-overlay');
    const closeSectionModalBtn = document.getElementById('close-section-modal-btn');
    const sectionTableBody = document.getElementById('section-table-body');
    const addSectionBtn = document.getElementById('add-section-btn');

    function renderAll() {
        renderSectionList();
        renderClassificationList();
        renderMainExamples();
        populateClassificationDropdown();
        populateSectionDropdown();
    }

    function renderSectionList() {
        const sectionList = document.getElementById('section-list');
        sectionList.innerHTML = '';

        sections.forEach(sec => {
            const link = document.createElement('a');
            link.textContent = sec;
            link.href = '#';
            link.className = `list-item ${sec === selectedSection ? 'active' : ''}`;
            link.onclick = (e) => {
                e.preventDefault();
                selectedSection = sec;
                const availableClassifications = classifications.filter(ch => ch.section === selectedSection);
                selectedClassification = availableClassifications[0] ? availableClassifications[0].name : "";
                renderAll();
            };
            sectionList.appendChild(link);
        });
    }

    function renderClassificationList() {
        const classificationList = document.getElementById('classification-list');
        classificationList.innerHTML = '';

        const filteredClassifications = classifications.filter(ch => ch.section === selectedSection);

        filteredClassifications.forEach(chObj => {
            const link = document.createElement('a');
            link.textContent = chObj.name;
            link.href = '#';
            link.className = `list-item ${chObj.name === selectedClassification ? 'active' : ''}`;
            link.onclick = (e) => {
                e.preventDefault();
                selectedClassification = chObj.name;
                renderAll();
            };
            classificationList.appendChild(link);
        });
    }

    function renderMainExamples() {
        exampleList.innerHTML = '';
        
        const headerText = selectedClassification ? `Examples : ${selectedClassification}` : "No Classification Selected";
        document.getElementById('current-classification-title').textContent = headerText;

        if (!selectedClassification) return;

        const filtered = examples.filter(item => item.classification === selectedClassification);
        filtered.forEach(item => {
            const hasUrl = item.url && item.url.trim() !== '';

            if (hasUrl) {
                const anchor = document.createElement('a');
                anchor.href = item.url.match(/^https?:\/\//i) ? item.url : 'https://' + item.url;
                anchor.textContent = item.text;
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                anchor.style.color = '#0000ee';
                exampleList.appendChild(anchor);
            } else {
                const span = document.createElement('span');
                span.className = 'example-text';
                span.textContent = item.text;
                span.style.color = '#000000';
                exampleList.appendChild(span);
            }
        });
    }

    function populateClassificationDropdown() {
        const dropdown = document.getElementById('new-classification');
        dropdown.innerHTML = '';
        classifications.forEach(ch => {
            const option = document.createElement('option');
            option.value = ch.name;
            option.textContent = `${ch.name} (${ch.section})`;
            if (ch.name === selectedClassification) option.selected = true;
            dropdown.appendChild(option);
        });
    }

    function populateSectionDropdown() {
        const dropdown = document.getElementById('new-classification-section');
        dropdown.innerHTML = '';
        sections.forEach(sec => {
            const option = document.createElement('option');
            option.value = sec;
            option.textContent = sec;
            if (sec === selectedSection) option.selected = true;
            dropdown.appendChild(option);
        });
    }

    document.getElementById('new-classification').addEventListener('change', (e) => {
        const selectedObj = classifications.find(ch => ch.name === e.target.value);
        if (selectedObj) {
            selectedSection = selectedObj.section;
            selectedClassification = selectedObj.name;
            renderAll();
            renderModalTable();
        }
    });

    function setupDragEvents(row, container, dataArray, onReorder) {
        row.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', row.dataset.index);
            row.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        row.addEventListener('dragend', () => {
            row.classList.remove('dragging');
        });

        row.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });

        row.addEventListener('drop', (e) => {
            e.preventDefault();
            const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
            const toIndex = parseInt(row.dataset.index);

            if (!isNaN(fromIndex) && fromIndex !== toIndex) {
                const [movedItem] = dataArray.splice(fromIndex, 1);
                dataArray.splice(toIndex, 0, movedItem);
                if (onReorder) onReorder();
            }
        });
    }

    function renderModalTable() {
        document.querySelector('#modal-overlay .modal-header h3').textContent = `Manage Examples : ${selectedClassification}`;
        modalTableBody.innerHTML = '';

        const filtered = examples
            .map((item, originalIndex) => ({ ...item, originalIndex }))
            .filter(item => item.classification === selectedClassification);

        filtered.forEach((item, displayIndex) => {
            const row = document.createElement('tr');
            row.dataset.index = displayIndex;

            const optionsHTML = classifications.map(ch => 
                `<option value="${ch.name}" ${ch.name === item.classification ? 'selected' : ''}>${ch.name}</option>`
            ).join('');

            row.innerHTML = `
                <td>${item.text}</td>
                <td>${item.url || '(No link)'}</td>
                <td>
                    <select class="classification-select" data-orig-index="${item.originalIndex}">
                        ${optionsHTML}
                    </select>
                </td>
                <td>
                    <button class="edit-btn" data-orig-index="${item.originalIndex}">Edit</button>
                    <button class="delete-btn" data-orig-index="${item.originalIndex}">Delete</button>
                </td>
            `;

            row.querySelector('.classification-select').addEventListener('change', (e) => {
                changeExampleClassification(item.originalIndex, e.target.value);
            });
            row.querySelector('.edit-btn').addEventListener('click', () => {
                editExample(item.originalIndex);
            });
            row.querySelector('.delete-btn').addEventListener('click', () => {
                deleteExample(item.originalIndex);
            });
            
            modalTableBody.appendChild(row);
        });
    }

    function changeExampleClassification(index, newClassification) {
        examples[index].classification = newClassification;
        saveData();
        renderAll();
        renderModalTable();
    }

    function renderClassificationModalTable() {
        classificationTableBody.innerHTML = '';
        const filteredClassifications = classifications.filter(ch => ch.section === selectedSection);

        filteredClassifications.forEach((ch) => {
            const globalIndex = classifications.findIndex(c => c.name === ch.name);

            const row = document.createElement('tr');
            row.className = 'draggable';
            row.draggable = true;
            row.dataset.index = globalIndex;

            const sectionOptionsHTML = sections.map(sec => 
                `<option value="${sec}" ${sec === ch.section ? 'selected' : ''}>${sec}</option>`
            ).join('');

            row.innerHTML = `
                <td>${ch.name}</td>
                <td>
                    <select class="section-select" data-idx="${globalIndex}">
                        ${sectionOptionsHTML}
                    </select>
                </td>
                <td>
                    <button class="edit-btn" data-idx="${globalIndex}">Edit</button>
                    <button class="delete-btn" data-ch="${ch.name}">Delete</button>
                </td>
            `;

            row.querySelector('.section-select').addEventListener('change', (e) => {
                classifications[globalIndex].section = e.target.value;
                saveData();
                renderAll();
                renderClassificationModalTable();
            });

            row.querySelector('.edit-btn').addEventListener('click', () => editClassification(globalIndex));
            row.querySelector('.delete-btn').addEventListener('click', () => deleteClassification(ch.name));

            setupDragEvents(row, classificationTableBody, classifications, () => {
                saveData();
                renderClassificationModalTable();
            });
            classificationTableBody.appendChild(row);
        });
    }

    function renderSectionModalTable() {
        sectionTableBody.innerHTML = '';
        sections.forEach((sec, index) => {
            const row = document.createElement('tr');
            row.className = 'draggable';
            row.draggable = true;
            row.dataset.index = index;

            row.innerHTML = `
                <td>${sec}</td>
                <td>
                    <button class="edit-btn" data-idx="${index}">Edit</button>
                    <button class="delete-btn" data-sec="${sec}">Delete</button>
                </td>
            `;

            row.querySelector('.edit-btn').addEventListener('click', () => editSection(index));
            row.querySelector('.delete-btn').addEventListener('click', () => deleteSection(sec));

            setupDragEvents(row, sectionTableBody, sections, () => {
                saveData();
                renderSectionModalTable();
            });
            sectionTableBody.appendChild(row);
        });
    }

    addExampleBtn.addEventListener('click', () => {
        const text = newTextInput.value.trim();
        let url = newUrlInput.value.trim();
        const classification = document.getElementById('new-classification').value;

        if (!text) {
            alert('Please fill in the display text.');
            return;
        }

        if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;

        examples.push({ text, url, classification });
        newTextInput.value = '';
        newUrlInput.value = '';
        sortExamplesArray();
        saveData();
        renderModalTable();
        renderMainExamples();
    });

    window.addEventListener('click', (event) => {
        if (event.target === modalOverlay) modalOverlay.style.display = 'none';
        if (event.target === classificationModalOverlay) classificationModalOverlay.style.display = 'none';
        if (event.target === sectionModalOverlay) sectionModalOverlay.style.display = 'none';
    });

    function editExample(index) {
        const item = examples[index];
        const newText = prompt("Edit display text:", item.text);
        if (newText === null) return;

        let newUrl = prompt("Edit URL (leave blank for none):", item.url || "");
        if (newUrl === null) return;

        if (newUrl.trim() && !/^https?:\/\//i.test(newUrl.trim())) newUrl = 'https://' + newUrl.trim();

        if (newText.trim()) {
            examples[index].text = newText.trim();
            examples[index].url = newUrl.trim();
            sortExamplesArray();
            saveData();
            renderModalTable();
            renderMainExamples();
        } else {
            alert("Text cannot be empty.");
        }
    }

    function deleteExample(index) {
        examples.splice(index, 1);
        saveData();
        renderModalTable();
        renderMainExamples();
    }

    addClassificationBtn.addEventListener('click', () => {
        const nameInput = document.getElementById('new-classification-name');
        const name = nameInput.value.trim();
        const section = document.getElementById('new-classification-section').value;

        if (!name) return;
        if (classifications.some(c => c.name === name && c.section === section)) {
            alert("Classification already exists in this section!");
            return;
        }

        classifications.push({ name, section });
        nameInput.value = '';
        saveData();
        renderClassificationModalTable();
    });

    function editClassification(index) {
        const oldName = classifications[index].name;
        const newName = prompt("Edit classification name:", oldName);
        if (!newName || !newName.trim() || newName === oldName) return;

        const cleanName = newName.trim();
        if (classifications.some(c => c.name === cleanName && c.section === classifications[index].section)) {
            alert("Classification name already exists in this section.");
            return;
        }

        classifications[index].name = cleanName;

        examples.forEach(item => {
            if (item.classification === oldName) item.classification = cleanName;
        });

        if (selectedClassification === oldName) selectedClassification = cleanName;

        saveData();
        renderClassificationModalTable();
    }

    function deleteClassification(classificationName) {
        if (classificationName === "Miscellaneous") {
            alert("The 'Miscellaneous' classification cannot be deleted.");
            return;
        }

        examples.forEach(item => {
            if (item.classification === classificationName) item.classification = "Miscellaneous";
        });

        classifications = classifications.filter(ch => ch.name !== classificationName);

        if (selectedClassification === classificationName) selectedClassification = "Miscellaneous";

        saveData();
        renderClassificationModalTable();
    }

    addSectionBtn.addEventListener('click', () => {
        const nameInput = document.getElementById('new-section-name');
        const name = nameInput.value.trim();

        if (!name) return;
        if (sections.includes(name)) {
            alert("Section already exists!");
            return;
        }

        sections.push(name);
        nameInput.value = '';
        saveData();
        renderSectionModalTable();
    });

    function editSection(index) {
        const oldName = sections[index];
        const newName = prompt("Edit section name:", oldName);
        if (!newName || !newName.trim() || newName === oldName) return;

        const cleanName = newName.trim();
        if (sections.includes(cleanName)) {
            alert("Section name already exists.");
            return;
        }

        sections[index] = cleanName;

        classifications.forEach(ch => {
            if (ch.section === oldName) ch.section = cleanName;
        });

        if (selectedSection === oldName) selectedSection = cleanName;

        saveData();
        renderSectionModalTable();
    }

    function deleteSection(sectionName) {
        if (sectionName === "Miscellaneous") {
            alert("The 'Miscellaneous' section cannot be deleted.");
            return;
        }

        classifications.forEach(ch => {
            if (ch.section === sectionName) ch.section = "Miscellaneous";
        });

        sections = sections.filter(sec => sec !== sectionName);

        if (selectedSection === sectionName) selectedSection = "Miscellaneous";

        saveData();
        renderSectionModalTable();
    }

    editExamplesBtn.addEventListener('click', () => {
        renderModalTable();
        modalOverlay.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => {
        modalOverlay.style.display = 'none';
    });

    editClassificationsBtn.addEventListener('click', () => {
        document.querySelector('#classification-modal-overlay .modal-header h3').textContent = `Manage Classifications : ${selectedSection}`;
        renderClassificationModalTable();
        classificationModalOverlay.style.display = 'flex';
    });

    closeClassificationModalBtn.addEventListener('click', () => {
        classificationModalOverlay.style.display = 'none';
    });

    editSectionsBtn.addEventListener('click', () => {
        renderSectionModalTable();
        sectionModalOverlay.style.display = 'flex';
    });

    closeSectionModalBtn.addEventListener('click', () => {
        sectionModalOverlay.style.display = 'none';
    });
</script>
</body>
</html>
