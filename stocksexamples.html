<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Examples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.modal-open {
            overflow: hidden;
        }

        .header-bar {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .main-layout {
            display: flex;
            gap: 20px;
        }

        .content-container {
            width: max-content;
            background-color: #ffffff;
            padding: 20px 20px 40px 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-height: 80vh;
        }

        .content-container.right-container {
            min-width: 500px;
        }

        .content-container.hidden-container {
            display: none !important;
        }

        button {
            font-size: 14px;
            padding: 6px 16px;
            cursor: pointer;
            margin-bottom: 0;
        }

        .list-item {
            font-size: 14px;
            color: #0000ee;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font-weight: normal;
            white-space: nowrap;
        }

        .list-item:hover {
            color: #0000ee;
            text-decoration: underline;
        }

        .list-item.active {
            color: red;
            text-decoration: underline;
            font-weight: normal;
        }

        #section-list, #classification-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        #edit-sections-btn, #edit-classifications-btn {
            margin-bottom: 20px;
        }

        .dropdown-select {
            display: none;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fff;
            color: #333;
        }

        .content-container h3 {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #current-classification-title {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #example-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }
        .column-select {
            width: 100%;
            padding: 4px;
            font-size: 14px;
        }

        a, span.example-text {
            font-size: 14px;
            text-decoration: none;
            text-align: left;
            white-space: nowrap;
        }

        a {
            color: #0000ee;
        }

        a:hover {
            text-decoration: underline;
        }

        span.example-text {
            color: #000000;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: fit-content;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .table-wrapper {
            overflow-y: auto;
            flex-grow: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }

        .link-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .link-table th, .link-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        .link-table th {
            background-color: #f2f2f2;
        }

        .edit-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 4px;
        }

        .edit-btn:hover {
            background-color: #0b7dda;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 0;
        }

        .delete-btn:hover {
            background-color: #cc0000;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .add-form input, .add-form select {
            padding: 6px;
            font-size: 14px;
        }

        .add-form button {
            margin-bottom: 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
        }

        .add-form button:hover {
            background-color: #45a049;
        }

        tr.draggable {
            cursor: grab;
        }
        tr.draggable:active {
            cursor: grabbing;
        }
        tr.dragging {
            opacity: 0.5;
            background-color: #e0e0e0;
        }
        .classification-select, .section-select {
            width: 100%;
            padding: 4px;
            font-size: 14px;
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Auth Form Styles */
        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-box h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-align: center;
        }

        .login-box input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-box button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
        }

        .logout-btn {
            background-color: #757575;
            color: white;
            border: none;
            border-radius: 4px;
        }

        #auth-error {
            color: red;
            font-size: 12px;
            margin: 0;
            display: none;
        }

        /* Autocomplete suggestions */
        .autocomplete-container {
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 150px;
            overflow-y: auto;
            z-index: 200;
            display: none;
        }
        .suggestion-item {
            padding: 6px 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .suggestion-item:hover {
            background-color: #f2f2f2;
        }

        .topic-search-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        .topic-search-row {
            display: flex;
            gap: 6px;
            align-items: center;
            width: 100%;
        }
        .topic-search-input {
            flex: 1;
            padding: 6px 8px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .clear-search-btn {
            padding: 6px 10px;
            font-size: 12px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .clear-search-btn:hover {
            background-color: #e0e0e0;
        }
        .section-header-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-header-row h3 {
            margin: 0;
        }
        .desktop-only {
            display: flex;
            flex-direction: column;
            margin-top: 60px;
        }
        .mobile-only {
            display: none;
        }

        /* Search Results Formatting Styles */
        .search-group-row {
            display: grid;
            grid-template-columns: max-content 1fr;
            column-gap: 12px;
            row-gap: 4px;
            align-items: baseline;
            width: 100%;
            font-family: monospace, Arial, sans-serif;
            font-size: 14px;
        }
        .search-group-title {
            font-weight: normal;
            color: #000000;
            white-space: nowrap;
        }
        .search-class-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            white-space: nowrap;
        }
        .search-class-item:not(:first-child) {
            grid-column: 2;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .main-layout {
                flex-direction: column;
                width: 100%;
                gap: 16px;
            }
            .content-container {
                width: 100% !important;
                min-height: auto;
                padding: 16px;
            }
            #section-list, #classification-list {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                align-items: center !important;
                gap: 6px !important;
            }
            .dropdown-select {
                display: none !important;
            }
            .desktop-only { display: none !important; }
            .mobile-only { display: flex !important; flex-direction: column !important; margin-top: 0 !important; margin-bottom: 15px !important; }
        }
    </style>
</head>
<body>

<!-- Login Modal (Admin Only) -->
<div class="modal-overlay" id="login-overlay" style="display: none;">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input type="email" id="login-email" placeholder="Email" autocomplete="username">
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
        <button id="login-btn">Sign In</button>
        <p id="auth-error"></p>
    </div>
</div>

<!-- Main App Layout -->
<div id="app-container" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <!-- Header bar (Admin Only) -->
    <div class="header-bar" id="admin-header-bar" style="display: none;">
        <span>Logged in as Admin</span>
        <div style="display: flex; gap: 8px;">
            <button class="logout-btn" onclick="window.open('stocksexamples.html', '_blank')">View Public Page</button>
            <button class="logout-btn" id="logout-btn">Log Out</button>
        </div>
    </div>

    <div class="main-layout">
        <!-- Sections Column -->
        <div class="content-container">
            <button id="edit-sections-btn" style="display: none;">Manage Sections</button>

                <h3>Sections</h3>
            </div>
            
            <!-- Mobile Search Box Position -->
            <div class="topic-search-container mobile-only">
                <label for="topic-search-input-mobile">search example :</label>

                    <input type="text" id="topic-search-input-mobile" class="topic-search-input" placeholder="Type to filter..." autocomplete="off">
                    <button id="clear-search-btn-mobile" class="clear-search-btn">clear</button>

            <select id="section-select" class="dropdown-select" aria-label="Select Section"></select>
            <!-- Section Links Container -->

            <!-- Desktop Search Box Position -->

                <label for="topic-search-input-desktop">search example :</label>

                    <input type="text" id="topic-search-input-desktop" class="topic-search-input" placeholder="Type to filter..." autocomplete="off">
                    <button id="clear-search-btn-desktop" class="clear-search-btn">clear</button>
                </div>
            </div>
        </div>

        <!-- Classifications Column -->
        <div class="content-container" id="classifications-container">
            <button id="edit-classifications-btn" style="display: none;">Manage Classifications</button>
            <h3>Classifications</h3>
            <select id="classification-select" class="dropdown-select" aria-label="Select Classification"></select>
            <div id="classification-list"></div>
        </div>

        <!-- Examples Column -->
        <div class="content-container right-container">
            <div class="button-row" id="admin-examples-btn-row" style="display: none;">
                <button id="edit-examples-btn">Manage Examples</button>
            </div>
            <h3 id="current-classification-title">Examples</h3>
            <div id="example-list"></div>
        </div>
    </div>
</div>

    <div class="modal-content">

<!-- Firebase SDK Imports & Main Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { 
        initializeFirestore, 
        persistentLocalCache, 
        persistentMultipleTabManager, 
        doc, 
        setDoc, 
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBgDtEmsmmglLcx6BbzR-IfFZ31duTPOag",
        authDomain: "toc-app-3ffe0.firebaseapp.com",
        projectId: "toc-app-3ffe0",
        storageBucket: "toc-app-3ffe0.firebasestorage.app",
        messagingSenderId: "1047075984315",
        appId: "1:1047075984315:web:8ddf68765cbef4efb2ea9e",
        measurementId: "G-H7677BPJ4G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, {
        localCache: persistentLocalCache({
            tabManager: persistentMultipleTabManager()
        })
    });
    const docRef = doc(db, "app_data", "stocks_state");

    const isAdminPage = window.location.hash.toLowerCase().includes('admin');

    let sections = ["Miscellaneous"];
    let classifications = [{ name: "Miscellaneous", section: "Miscellaneous" }];
    let examples = [];

    let selectedSection = "Miscellaneous";
    let selectedClassification = "Miscellaneous";
    let topicSearchQuery = "";

    const loginOverlay = document.getElementById('login-overlay');
    const adminHeaderBar = document.getElementById('admin-header-bar');
    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const authError = document.getElementById('auth-error');

    const editSectionsBtn = document.getElementById('edit-sections-btn');
    const editClassificationsBtn = document.getElementById('edit-classifications-btn');
    const adminExamplesBtnRow = document.getElementById('admin-examples-btn-row');
    
    const sectionSelect = document.getElementById('section-select');
    const classificationSelect = document.getElementById('classification-select');

    const topicSearchInputMobile = document.getElementById('topic-search-input-mobile');
    const clearSearchBtnMobile = document.getElementById('clear-search-btn-mobile');
    const topicSearchInputDesktop = document.getElementById('topic-search-input-desktop');
    const clearSearchBtnDesktop = document.getElementById('clear-search-btn-desktop');

    function slugify(text) {
        return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function saveNavigationState() {
        localStorage.setItem('stocks_selected_section', selectedSection);
        localStorage.setItem('stocks_selected_classification', selectedClassification);
    }

    // Initialize View Mode (Admin vs Public)
    if (isAdminPage) {
        loginEmailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
        loginPasswordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

        loginBtn.addEventListener('click', async () => {
            const email = loginEmailInput.value.trim();
            const password = loginPasswordInput.value.trim();
            authError.style.display = 'none';

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                authError.textContent = "Invalid login credentials.";
                authError.style.display = 'block';
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginOverlay.style.display = 'none';
                adminHeaderBar.style.display = 'flex';
                editSectionsBtn.style.display = 'block';
                editClassificationsBtn.style.display = 'block';
                adminExamplesBtnRow.style.display = 'flex';
            } else {
                loginOverlay.style.display = 'flex';
                adminHeaderBar.style.display = 'none';
                editSectionsBtn.style.display = 'none';
                editClassificationsBtn.style.display = 'none';
                adminExamplesBtnRow.style.display = 'none';
            }
        });
    }

    sectionSelect.addEventListener('change', (e) => {
        selectedSection = e.target.value;
        const isSearching = topicSearchQuery.trim() !== '';
        const activeExamples = getFilteredExamples();
        const availableClassifications = isSearching 
            ? classifications.filter(ch => ch.section === selectedSection && activeExamples.some(link => link.classification === ch.name))
            : classifications.filter(ch => ch.section === selectedSection);
        selectedClassification = availableClassifications[0] ? availableClassifications[0].name : "";
        saveNavigationState();
        renderAll();
    });

    classificationSelect.addEventListener('change', (e) => {
        selectedClassification = e.target.value;
        saveNavigationState();
        if (!isAdminPage) {
            history.pushState({ classification: selectedClassification }, '', `#${slugify(selectedClassification)}`);
        }
        renderAll();
    });

    function sortExamplesArray() {
        examples.sort((a, b) => {
            const getYear = (str) => {
                const match = str.match(/(\d{4})/);
                return match ? parseInt(match[1], 10) : 0;
            };
            const yearA = getYear(a.text);
            const yearB = getYear(b.text);
            if (yearB !== yearA) return yearB - yearA;
            return a.text.localeCompare(b.text);
        });
    }

    function getFilteredExamples() {
        let result = examples;
        if (topicSearchQuery.trim() !== '') {
            const query = topicSearchQuery.toLowerCase().trim();
            result = result.filter(item => {
                const textMatches = item.text && item.text.toLowerCase().includes(query);
                const classMatches = item.classification && item.classification.toLowerCase().includes(query);
                const urlMatches = item.url && item.url.toLowerCase().includes(query);
                return textMatches || classMatches || urlMatches;
            });
        }
        return result;
    }

    async function saveData() {
        try {
            const payload = { sections, classifications, examples };
            await setDoc(docRef, payload, { merge: true });
        } catch (e) {
            console.error("Error writing document to Firebase: ", e);
            alert("Error saving: You may not have write permission.");
        }
    }

    // Real-time listener for data
    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            sections = data.sections || ["Miscellaneous"];
            classifications = (data.classifications || [{ name: "Miscellaneous", section: "Miscellaneous", columns: 1 }]).map(ch => ({
                ...ch,
                columns: ch.columns || 1
            }));
            examples = data.examples || [];
            sortExamplesArray();

            if (!isAdminPage) {
                const hash = window.location.hash.replace('#', '');
                let hashMatched = false;
                if (hash && hash !== 'settings') {
                    const matchedClass = classifications.find(ch => slugify(ch.name) === hash);
                    if (matchedClass) {
                        selectedClassification = matchedClass.name;
                        selectedSection = matchedClass.section;
                        hashMatched = true;
                    }
                }
                if (!hashMatched) {
                    const savedSection = localStorage.getItem('stocks_selected_section');
                    const savedClassification = localStorage.getItem('stocks_selected_classification');
                    if (savedSection) selectedSection = savedSection;
                    if (savedClassification) selectedClassification = savedClassification;
                }
            }

            const isSearching = topicSearchQuery.trim() !== '';
            const activeExamples = getFilteredExamples();
            const visibleSections = isSearching 
                ? sections.filter(sec => {
                    const secClassifications = classifications.filter(ch => ch.section === sec);
                    return secClassifications.some(ch => activeExamples.some(link => link.classification === ch.name));
                  })
                : sections;

            if (!visibleSections.includes(selectedSection)) {
                selectedSection = visibleSections[0] || sections[0] || "Miscellaneous";
            }

            const visibleClassifications = isSearching
                ? classifications.filter(ch => ch.section === selectedSection && activeExamples.some(link => link.classification === ch.name))
                : classifications.filter(ch => ch.section === selectedSection);

            if (!visibleClassifications.some(ch => ch.name === selectedClassification)) {
                selectedClassification = visibleClassifications[0] ? visibleClassifications[0].name : "";
            }

            saveNavigationState();
            renderAll();
        } else if (!docSnap.metadata.fromCache && isAdminPage) {
            saveData();
        }
    });

    const editExamplesBtn = document.getElementById('edit-examples-btn');
    const exampleList = document.getElementById('example-list');
    const modalOverlay = document.getElementById('modal-overlay');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const modalTableBody = document.getElementById('modal-table-body');
    const addExampleBtn = document.getElementById('add-example-btn');
    const newTextInput = document.getElementById('new-text');
    const newUrlInput = document.getElementById('new-url');

    if (isAdminPage) {
        [newTextInput, newUrlInput].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addExampleBtn.click();
                }
            });
        });
    }

    const suggestionsBox = document.getElementById('suggestions-box');
    if (isAdminPage) {
        newTextInput.addEventListener('input', () => {
            const query = newTextInput.value.toLowerCase().trim();
            suggestionsBox.innerHTML = '';
            
            if (!query) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const seenTexts = new Set();
            const matches = examples.filter(item => {
                const matchesQuery = item.text.toLowerCase().includes(query);
                if (matchesQuery && !seenTexts.has(item.text)) {
                    seenTexts.add(item.text);
                    return true;
                }
                return false;
            });

            if (matches.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.text;
                div.addEventListener('click', () => {
                    newTextInput.value = item.text;
                    if (item.url) newUrlInput.value = item.url;
                    suggestionsBox.style.display = 'none';
                });
                suggestionsBox.appendChild(div);
            });

            suggestionsBox.style.display = 'block';
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.autocomplete-container')) {
                suggestionsBox.style.display = 'none';
            }
        });
    }

    const classificationModalOverlay = document.getElementById('classification-modal-overlay');
    const closeClassificationModalBtn = document.getElementById('close-classification-modal-btn');
    const classificationTableBody = document.getElementById('classification-table-body');
    const addClassificationBtn = document.getElementById('add-classification-btn');

    const sectionModalOverlay = document.getElementById('section-modal-overlay');
    const closeSectionModalBtn = document.getElementById('close-section-modal-btn');
    const sectionTableBody = document.getElementById('section-table-body');
    const addSectionBtn = document.getElementById('add-section-btn');

    function renderAll() {
        const isSearching = topicSearchQuery.trim() !== '';
        const classificationsContainer = document.getElementById('classifications-container');

        if (isSearching) {
            classificationsContainer.classList.add('hidden-container');
        } else {
            classificationsContainer.classList.remove('hidden-container');
        }

        renderSectionList();
        renderClassificationList();
        renderMainExamples();
        if (isAdminPage) {
            populateClassificationDropdown();
            populateSectionDropdown();
        }
        updateContainerWidth();
    }

    function renderSectionList() {
        const sectionList = document.getElementById('section-list');
        sectionList.innerHTML = '';
        sectionSelect.innerHTML = '';

        const isSearching = topicSearchQuery.trim() !== '';

        if (isSearching) {
            sectionList.style.display = 'none';
            sectionSelect.style.display = 'none';
            return;
        } else {
            sectionList.style.display = '';
            sectionSelect.style.display = '';
        }

        const visibleSections = sections;

        visibleSections.forEach(sec => {
            const link = document.createElement('a');
            link.textContent = sec;
            link.href = '#';
            link.className = `list-item ${sec === selectedSection ? 'active' : ''}`;
            link.onclick = (e) => {
                e.preventDefault();
                selectedSection = sec;
                const visibleChs = classifications.filter(ch => ch.section === selectedSection);
                selectedClassification = visibleChs[0] ? visibleChs[0].name : "";
                saveNavigationState();
                renderAll();
            };
            sectionList.appendChild(link);

            const option = document.createElement('option');
            option.value = sec;
            option.textContent = sec;
            if (sec === selectedSection) option.selected = true;
            sectionSelect.appendChild(option);
        });
    }

    function renderClassificationList() {
        const classificationList = document.getElementById('classification-list');
        classificationList.innerHTML = '';
        classificationSelect.innerHTML = '';

        const isSearching = topicSearchQuery.trim() !== '';
        if (isSearching) return;

        const visibleClassifications = classifications.filter(ch => ch.section === selectedSection);

        visibleClassifications.forEach(chObj => {
            const count = examples.filter(item => item.classification === chObj.name).length;

            const link = document.createElement('a');
            link.textContent = `${chObj.name} (${count})`;
            link.href = '#';
            link.className = `list-item ${chObj.name === selectedClassification ? 'active' : ''}`;
            link.onclick = (e) => {
                e.preventDefault();
                selectedClassification = chObj.name;
                saveNavigationState();
                if (!isAdminPage) {
                    history.pushState({ classification: chObj.name }, '', `#${slugify(chObj.name)}`);
                }
                renderAll();
            };
            classificationList.appendChild(link);

            const option = document.createElement('option');
            option.value = chObj.name;
            option.textContent = `${chObj.name} (${count})`;
            if (chObj.name === selectedClassification) option.selected = true;
            classificationSelect.appendChild(option);
        });
    }

    function renderMainExamples() {
        exampleList.innerHTML = '';
        const isSearching = topicSearchQuery.trim() !== '';
        
        if (isSearching) {
            document.getElementById('current-classification-title').textContent = `Examples : ${topicSearchQuery.toUpperCase()}`;
            
            exampleList.style.display = 'flex';
            exampleList.style.flexDirection = 'column';
            exampleList.style.alignItems = 'flex-start';
            exampleList.style.gap = '16px';
            exampleList.style.columnCount = '';
            exampleList.style.columnGap = '';

            const matchingExamples = getFilteredExamples();

            const groupedMap = new Map();

            matchingExamples.forEach(item => {
                if (!groupedMap.has(item.text)) {
                    groupedMap.set(item.text, []);
                }
                groupedMap.get(item.text).push(item);
            });

            const getYearFromText = (str) => {
                const match = str.match(/(\d{4})/);
                return match ? parseInt(match[1], 10) : 0;
            };

            const sortedGroupEntries = Array.from(groupedMap.entries()).sort((a, b) => {
                const yearA = getYearFromText(a[0]);
                const yearB = getYearFromText(b[0]);
                if (yearB !== yearA) return yearB - yearA;
                return a[0].localeCompare(b[0]);
            });

            sortedGroupEntries.forEach(([exampleText, itemsGroup]) => {
                const groupRow = document.createElement('div');
                groupRow.className = 'search-group-row';

                const titleSpan = document.createElement('span');
                titleSpan.className = 'search-group-title';
                titleSpan.textContent = exampleText;
                groupRow.appendChild(titleSpan);

                itemsGroup.forEach((item, index) => {
                    const classItem = document.createElement('div');
                    classItem.className = 'search-class-item';

                    const dashSpan = document.createElement('span');
                    dashSpan.textContent = '-';
                    dashSpan.style.color = '#000000';
                    classItem.appendChild(dashSpan);

                    const hasUrl = item.url && item.url.trim() !== '';
                    if (hasUrl) {
                        const anchor = document.createElement('a');
                        anchor.href = item.url.match(/^https?:\/\//i) ? item.url : 'https://' + item.url;
                        anchor.textContent = item.classification;
                        anchor.target = "_blank";
                        anchor.rel = "noopener noreferrer";
                        anchor.style.color = '#0000ee';
                        classItem.appendChild(anchor);
                    } else {
                        const classSpan = document.createElement('span');
                        classSpan.textContent = item.classification;
                        classSpan.style.color = '#000000';
                        classItem.appendChild(classSpan);
                    }

                    groupRow.appendChild(classItem);
                });

                exampleList.appendChild(groupRow);
            });

            return;
        }

        const headerText = selectedClassification ? `Examples : ${selectedClassification}` : "No Classification Selected";
        document.getElementById('current-classification-title').textContent = headerText;

        if (!selectedClassification) return;

        const currentClassObj = classifications.find(ch => ch.name === selectedClassification);
        const colCount = currentClassObj && currentClassObj.columns ? currentClassObj.columns : 1;

        if (colCount > 1) {
            exampleList.style.display = 'block';
            exampleList.style.columnCount = colCount;
            exampleList.style.columnGap = '40px';
        } else {
            exampleList.style.display = 'flex';
            exampleList.style.flexDirection = 'column';
            exampleList.style.alignItems = 'flex-start';
            exampleList.style.gap = '20px';
            exampleList.style.columnCount = '';
            exampleList.style.columnGap = '';
        }

        const filtered = examples.filter(item => item.classification === selectedClassification);
        filtered.forEach(item => {
            const hasUrl = item.url && item.url.trim() !== '';

            if (hasUrl) {
                const anchor = document.createElement('a');
                anchor.href = item.url.match(/^https?:\/\//i) ? item.url : 'https://' + item.url;
                anchor.textContent = item.text;
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                anchor.style.color = '#0000ee';
                if (colCount > 1) {
                    anchor.style.display = 'block';
                    anchor.style.marginBottom = '20px';
                    anchor.style.breakInside = 'avoid';
                }
                exampleList.appendChild(anchor);
            } else {
                const span = document.createElement('span');
                span.className = 'example-text';
                span.textContent = item.text;
                span.style.color = '#000000';
                if (colCount > 1) {
                    span.style.display = 'block';
                    span.style.marginBottom = '20px';
                    span.style.breakInside = 'avoid';
                }
                exampleList.appendChild(span);
            }
        });
    }

    function populateClassificationDropdown() {
        const dropdown = document.getElementById('new-classification');
        if (!dropdown) return;
        dropdown.innerHTML = '';
        classifications.forEach(ch => {
            const option = document.createElement('option');
            option.value = ch.name;
            option.textContent = `${ch.name} (${ch.section})`;
            if (ch.name === selectedClassification) option.selected = true;
            dropdown.appendChild(option);
        });
    }

    function populateSectionDropdown() {
        const dropdown = document.getElementById('new-classification-section');
        if (!dropdown) return;
        dropdown.innerHTML = '';
        sections.forEach(sec => {
            const option = document.createElement('option');
            option.value = sec;
            option.textContent = sec;
            if (sec === selectedSection) option.selected = true;
            dropdown.appendChild(option);
        });
    }

    if (isAdminPage) {
        document.getElementById('new-classification').addEventListener('change', (e) => {
            const selectedObj = classifications.find(ch => ch.name === e.target.value);
            if (selectedObj) {
                selectedSection = selectedObj.section;
                selectedClassification = selectedObj.name;
                renderAll();
                renderModalTable();
            }
        });
    }

    function setupDragEvents(row, container, dataArray, onReorder) {
        row.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', row.dataset.index);
            row.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
        row.addEventListener('drop', (e) => {
            e.preventDefault();
            const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
            const toIndex = parseInt(row.dataset.index);
            if (!isNaN(fromIndex) && fromIndex !== toIndex) {
                const [movedItem] = dataArray.splice(fromIndex, 1);
                dataArray.splice(toIndex, 0, movedItem);
                if (onReorder) onReorder();
            }
        });
    }

    function renderModalTable() {
        document.querySelector('#modal-overlay .modal-header h3').textContent = `Manage Examples : ${selectedClassification}`;
        modalTableBody.innerHTML = '';

        const filtered = examples
            .map((item, originalIndex) => ({ ...item, originalIndex }))
            .filter(item => item.classification === selectedClassification);

        filtered.forEach((item, displayIndex) => {
            const row = document.createElement('tr');
            row.dataset.index = displayIndex;

            const optionsHTML = classifications.map(ch => 
                `<option value="${ch.name}" ${ch.name === item.classification ? 'selected' : ''}>${ch.name}</option>`
            ).join('');

            row.innerHTML = `
                <td>${item.text}</td>
                <td>${item.url || '(No link)'}</td>
                <td>
                    <select class="classification-select" data-orig-index="${item.originalIndex}">
                        ${optionsHTML}
                    </select>
                </td>
                <td>
                    <button class="edit-btn" data-orig-index="${item.originalIndex}">Edit</button>
                    <button class="delete-btn" data-orig-index="${item.originalIndex}">Delete</button>
                </td>
            `;

            row.querySelector('.classification-select').addEventListener('change', (e) => {
                changeExampleClassification(item.originalIndex, e.target.value);
            });
            row.querySelector('.edit-btn').addEventListener('click', () => editExample(item.originalIndex));
            row.querySelector('.delete-btn').addEventListener('click', () => deleteExample(item.originalIndex));

            modalTableBody.appendChild(row);
        });
    }

    function changeExampleClassification(index, newClassification) {
        examples[index].classification = newClassification;
        saveData();
        renderAll();
        renderModalTable();
    }

    function renderClassificationModalTable() {
        classificationTableBody.innerHTML = '';
        const filteredClassifications = classifications.filter(ch => ch.section === selectedSection);

        filteredClassifications.forEach((ch) => {
            const globalIndex = classifications.findIndex(c => c.name === ch.name);
            const row = document.createElement('tr');
            row.className = 'draggable';
            row.draggable = true;
            row.dataset.index = globalIndex;

            const sectionOptionsHTML = sections.map(sec => 
                `<option value="${sec}" ${sec === ch.section ? 'selected' : ''}>${sec}</option>`
            ).join('');

            const columnOptionsHTML = [1, 2, 3].map(num => 
                `<option value="${num}" ${num === (ch.columns || 1) ? 'selected' : ''}>${num}</option>`
            ).join('');

            row.innerHTML = `
                <td>${ch.name}</td>
                <td><select class="section-select" data-idx="${globalIndex}">${sectionOptionsHTML}</select></td>
                <td><select class="column-select" data-idx="${globalIndex}">${columnOptionsHTML}</select></td>
                <td>
                    <button class="edit-btn" data-idx="${globalIndex}">Edit</button>
                    <button class="delete-btn" data-ch="${ch.name}">Delete</button>
                </td>
            `;

            row.querySelector('.section-select').addEventListener('change', (e) => {
                classifications[globalIndex].section = e.target.value;
                saveData();
                renderAll();
                renderClassificationModalTable();
            });

            row.querySelector('.column-select').addEventListener('change', (e) => {
                classifications[globalIndex].columns = parseInt(e.target.value, 10);
                saveData();
                renderAll();
                renderClassificationModalTable();
            });

            row.querySelector('.edit-btn').addEventListener('click', () => editClassification(globalIndex));
            row.querySelector('.delete-btn').addEventListener('click', () => deleteClassification(ch.name));

            setupDragEvents(row, classificationTableBody, classifications, () => {
                saveData();
                renderClassificationModalTable();
            });
            classificationTableBody.appendChild(row);
        });
    }

    function renderSectionModalTable() {
        sectionTableBody.innerHTML = '';
        sections.forEach((sec, index) => {
            const row = document.createElement('tr');
            row.className = 'draggable';
            row.draggable = true;
            row.dataset.index = index;

            row.innerHTML = `
                <td>${sec}</td>
                <td>
                    <button class="edit-btn" data-idx="${index}">Edit</button>
                    <button class="delete-btn" data-sec="${sec}">Delete</button>
                </td>
            `;

            row.querySelector('.edit-btn').addEventListener('click', () => editSection(index));
            row.querySelector('.delete-btn').addEventListener('click', () => deleteSection(sec));

            setupDragEvents(row, sectionTableBody, sections, () => {
                saveData();
                renderSectionModalTable();
            });
            sectionTableBody.appendChild(row);
        });
    }

    if (isAdminPage) {
        addExampleBtn.addEventListener('click', () => {
            const text = newTextInput.value.trim();
            let url = newUrlInput.value.trim();
            const classification = document.getElementById('new-classification').value;

            if (!text) { alert('Please fill in the display text.'); return; }
            if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;

            examples.push({ text, url, classification });
            newTextInput.value = '';
            newUrlInput.value = '';
            sortExamplesArray();
            saveData();
            renderModalTable();
            renderMainExamples();
        });

        window.addEventListener('click', (event) => {
            if (event.target === modalOverlay) modalOverlay.style.display = 'none';
            if (event.target === classificationModalOverlay) classificationModalOverlay.style.display = 'none';
            if (event.target === sectionModalOverlay) sectionModalOverlay.style.display = 'none';
        });

        addClassificationBtn.addEventListener('click', () => {
            const nameInput = document.getElementById('new-classification-name');
            const name = nameInput.value.trim();
            const section = document.getElementById('new-classification-section').value;

            if (!name) return;
            if (classifications.some(c => c.name === name && c.section === section)) {
                alert("Classification already exists in this section!");
                return;
            }

            classifications.push({ name, section, columns: 1 });
            nameInput.value = '';
            saveData();
            renderClassificationModalTable();
        });

        addSectionBtn.addEventListener('click', () => {
            const nameInput = document.getElementById('new-section-name');
            const name = nameInput.value.trim();

            if (!name) return;
            if (sections.includes(name)) { alert("Section already exists!"); return; }

            sections.push(name);
            nameInput.value = '';
            saveData();
            renderSectionModalTable();
        });
    }

    function editExample(index) {
        const item = examples[index];
        const newText = prompt("Edit display text:", item.text);
        if (newText === null) return;

        let newUrl = prompt("Edit URL (leave blank for none):", item.url || "");
        if (newUrl === null) return;

        if (newUrl.trim() && !/^https?:\/\//i.test(newUrl.trim())) newUrl = 'https://' + newUrl.trim();

        if (newText.trim()) {
            examples[index].text = newText.trim();
            examples[index].url = newUrl.trim();
            sortExamplesArray();
            saveData();
            renderModalTable();
            renderMainExamples();
        } else {
            alert("Text cannot be empty.");
        }
    }

    function deleteExample(index) {
        examples.splice(index, 1);
        saveData();
        renderModalTable();
        renderMainExamples();
    }

    function editClassification(index) {
        const oldName = classifications[index].name;
        const newName = prompt("Edit classification name:", oldName);
        if (!newName || !newName.trim() || newName === oldName) return;

        const cleanName = newName.trim();
        if (classifications.some(c => c.name === cleanName && c.section === classifications[index].section)) {
            alert("Classification name already exists in this section.");
            return;
        }

        classifications[index].name = cleanName;
        examples.forEach(item => { if (item.classification === oldName) item.classification = cleanName; });
        if (selectedClassification === oldName) selectedClassification = cleanName;

        saveData();
        renderClassificationModalTable();
    }

    function deleteClassification(classificationName) {
        if (classificationName === "Miscellaneous") {
            alert("The 'Miscellaneous' classification cannot be deleted.");
            return;
        }
        examples.forEach(item => { if (item.classification === classificationName) item.classification = "Miscellaneous"; });
        classifications = classifications.filter(ch => ch.name !== classificationName);
        if (selectedClassification === classificationName) selectedClassification = "Miscellaneous";

        saveData();
        renderClassificationModalTable();
    }

    function editSection(index) {
        const oldName = sections[index];
        const newName = prompt("Edit section name:", oldName);
        if (!newName || !newName.trim() || newName === oldName) return;

        const cleanName = newName.trim();
        if (sections.includes(cleanName)) { alert("Section name already exists."); return; }

        sections[index] = cleanName;
        classifications.forEach(ch => { if (ch.section === oldName) ch.section = cleanName; });
        if (selectedSection === oldName) selectedSection = cleanName;

        saveData();
        renderSectionModalTable();
    }

    function deleteSection(sectionName) {
        if (sectionName === "Miscellaneous") {
            alert("The 'Miscellaneous' section cannot be deleted.");
            return;
        }
        classifications.forEach(ch => { if (ch.section === sectionName) ch.section = "Miscellaneous"; });
        sections = sections.filter(sec => sec !== sectionName);
        if (selectedSection === sectionName) selectedSection = "Miscellaneous";

        saveData();
        renderSectionModalTable();
    }

    if (isAdminPage) {
        editExamplesBtn.addEventListener('click', () => { renderModalTable(); modalOverlay.style.display = 'flex'; });
        closeModalBtn.addEventListener('click', () => { modalOverlay.style.display = 'none'; });
        editClassificationsBtn.addEventListener('click', () => {
            document.querySelector('#classification-modal-overlay .modal-header h3').textContent = `Manage Classifications : ${selectedSection}`;
            renderClassificationModalTable();
            classificationModalOverlay.style.display = 'flex';
        });
        closeClassificationModalBtn.addEventListener('click', () => { classificationModalOverlay.style.display = 'none'; });
        editSectionsBtn.addEventListener('click', () => { renderSectionModalTable(); sectionModalOverlay.style.display = 'flex'; });
        closeSectionModalBtn.addEventListener('click', () => { sectionModalOverlay.style.display = 'none'; });
    }

    // Synced search handlers for both desktop and mobile inputs
    function executeSearch(queryValue) {
        topicSearchQuery = queryValue;
        if (topicSearchInputMobile) topicSearchInputMobile.value = topicSearchQuery;
        if (topicSearchInputDesktop) topicSearchInputDesktop.value = topicSearchQuery;
        
        saveNavigationState();
        renderAll();
    }

    if (topicSearchInputMobile) topicSearchInputMobile.addEventListener('input', (e) => executeSearch(e.target.value));
    if (topicSearchInputDesktop) topicSearchInputDesktop.addEventListener('input', (e) => executeSearch(e.target.value));

    function clearSearch() { executeSearch(""); }

    if (clearSearchBtnMobile) clearSearchBtnMobile.addEventListener('click', clearSearch);
    if (clearSearchBtnDesktop) clearSearchBtnDesktop.addEventListener('click', clearSearch);

    window.addEventListener('resize', () => { updateContainerWidth(); });

    function updateContainerWidth() {
        const classificationsContainer = document.getElementById('classifications-container');
        if (window.innerWidth <= 768) {
            if (classificationsContainer) classificationsContainer.style.minWidth = '';
            return;
        }

        const measurer = document.createElement('span');
        measurer.style.visibility = 'hidden';
        measurer.style.position = 'absolute';
        measurer.style.whiteSpace = 'nowrap';
        measurer.style.font = window.getComputedStyle(document.body).font;
        document.body.appendChild(measurer);

        if (classificationsContainer) {
            if (!classifications.length) {
                classificationsContainer.style.minWidth = '';
            } else {
                let maxClassWidth = 0;
                classifications.forEach(ch => {
                    measurer.textContent = ch.name;
                    const width = measurer.getBoundingClientRect().width;
                    if (width > maxClassWidth) maxClassWidth = width;
                });
                classificationsContainer.style.minWidth = `${Math.ceil(maxClassWidth) + 60}px`;
            }
        }
        document.body.removeChild(measurer);
    }
</script>
</body>
</html>
