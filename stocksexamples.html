<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Examples - Contents</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            color: #000000;
            display: flex;
            justify-content: center;
        }

        body.modal-open {
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            gap: 20px;
        }

        .content-container {
            width: max-content;
            background-color: #ffffff;
            padding: 20px 20px 40px 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-height: 80vh;
        }

        .list-item {
            font-size: 14px;
            color: #0000ee;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font-weight: normal;
            white-space: nowrap;
        }

        .list-item:hover {
            color: #0000ee;
            text-decoration: underline;
        }

        .list-item.active {
            color: red;
            text-decoration: underline;
            font-weight: normal;
        }

        #section-list, #classification-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        .dropdown-select {
            display: none;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fff;
            color: #333;
        }

        .content-container h3 {
            margin-bottom: 20px;
            margin-top: 0;
        }

        .content-container.hidden-container {
            display: none !important;
        }

        .content-container.right-container {
        min-width: 500px; /* Change this number to whatever fixed width you prefer */
        }

        #current-classification-title {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #example-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        a, span.example-text {
            font-size: 14px;
            text-decoration: none;
            text-align: left;
            white-space: nowrap;
        }

        a {
            color: #0000ee;
        }

        a:hover {
            text-decoration: underline;
        }

        span.example-text {
            color: #000000;
            cursor: default;
        }

        /* Settings Button & Modal Styles */
        .settings-btn {
            margin-top: 60px;
            padding: 6px 12px;
            font-size: 13px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        .settings-btn:hover {
            background-color: #e0e0e0;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            width: max-content;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        .settings-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topic-search-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .topic-search-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .topic-search-input {
            flex: 1;
            padding: 6px 8px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .clear-search-btn {
            padding: 6px 10px;
            font-size: 12px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .clear-search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-search-btn:not(:disabled):hover {
            background-color: #e0e0e0;
        }

        .section-header-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header-row h3 {
            margin: 0;
        }

        .desktop-only {
            display: inline-block;
            margin-top: 60px;
        }

        .mobile-only {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
                font-size: 14px;
            }

            .main-layout {
                flex-direction: column;
                width: 100%;
                gap: 16px;
            }

            .content-container {
                width: 100% !important;
                min-height: auto;
                padding: 16px 16px 30px 16px;
            }

            #section-list, #classification-list {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                align-items: center !important;
                gap: 6px !important;
                width: 100%;
            }

            .dropdown-select {
                display: none !important;
            }

            #section-list .list-item,
            #classification-list .list-item {
                display: inline-flex !important;
                align-items: center !important;
                font-size: 14px;
                line-height: 1.5;
            }

            #section-list .list-item:not(:last-child)::after,
            #classification-list .list-item:not(:last-child)::after {
                content: "|";
                color: #000000;
                margin: 0 6px;
                text-decoration: none !important;
                font-weight: normal;
                pointer-events: none;
            }

            .section-header-row {
                display: flex !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: center !important;
                width: 100% !important;
                margin-bottom: 12px;
            }

            .section-header-row h3 {
                margin: 0 !important;
            }

            .desktop-only {
                display: none !important;
            }

            .mobile-only {
                display: inline-block !important;
                margin-top: 0 !important;
                padding: 5px 12px;
            }
        }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- Sections Container -->
    <div class="content-container">
        <div class="section-header-row">
            <h3>Sections</h3>
            <button id="settings-btn-mobile" class="settings-btn mobile-only">Settings</button>
        </div>
        <select id="section-select" class="dropdown-select" aria-label="Select Section"></select>
        <div id="section-list"></div>
        <button id="settings-btn-desktop" class="settings-btn desktop-only">Settings</button>
    </div>

    <!-- Classifications Container -->
    <div class="content-container" id="classifications-container">
        <h3>Classifications</h3>
        <select id="classification-select" class="dropdown-select" aria-label="Select Classification"></select>
        <div id="classification-list"></div>
    </div>

    <!-- Examples Container -->
    <div class="content-container right-container" id="examples-container">
        <h3 id="current-classification-title">Examples</h3>
        <div id="example-list"></div>
    </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Settings</h3>
            <button class="close-btn" id="close-settings-modal-btn">&times;</button>
        </div>
        <div class="settings-options">
            <!-- SEARCH BOX -->
            <div class="topic-search-container">
                <label for="topic-search-input">search example :</label>
                <div class="topic-search-row">
                    <input type="text" id="topic-search-input" class="topic-search-input" placeholder="Type to filter..." autocomplete="off">
                    <button id="clear-search-btn" class="clear-search-btn">clear</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK Imports -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        initializeFirestore, 
        persistentLocalCache, 
        persistentMultipleTabManager, 
        doc, 
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBgDtEmsmmglLcx6BbzR-IfFZ31duTPOag",
        authDomain: "toc-app-3ffe0.firebaseapp.com",
        projectId: "toc-app-3ffe0",
        storageBucket: "toc-app-3ffe0.firebasestorage.app",
        messagingSenderId: "1047075984315",
        appId: "1:1047075984315:web:8ddf68765cbef4efb2ea9e",
        measurementId: "G-H7677BPJ4G"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
        localCache: persistentLocalCache({
            tabManager: persistentMultipleTabManager()
        })
    });
    const docRef = doc(db, "app_data", "stocks_state");

    let sections = ["Miscellaneous"];
    let classifications = [{ name: "Miscellaneous", section: "Miscellaneous" }];
    let examples = [];

    let selectedSection = "Miscellaneous";
    let selectedClassification = "Miscellaneous";
    let topicSearchQuery = "";

    const exampleList = document.getElementById('example-list');
    const sectionSelect = document.getElementById('section-select');
    const classificationSelect = document.getElementById('classification-select');
    const topicSearchInput = document.getElementById('topic-search-input');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    const settingsModalOverlay = document.getElementById('settings-modal-overlay');
    const closeSettingsModalBtn = document.getElementById('close-settings-modal-btn');

    function slugify(text) {
        return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function saveNavigationState() {
        localStorage.setItem('stocks_selected_section', selectedSection);
        localStorage.setItem('stocks_selected_classification', selectedClassification);
    }

    sectionSelect.addEventListener('change', (e) => {
        selectedSection = e.target.value;
        const activeExamples = getFilteredExamples();
        const availableClassifications = classifications.filter(ch => 
            ch.section === selectedSection && activeExamples.some(link => link.classification === ch.name)
        );
        selectedClassification = availableClassifications[0] ? availableClassifications[0].name : "";
        saveNavigationState();
        renderAll();
    });

    classificationSelect.addEventListener('change', (e) => {
        selectedClassification = e.target.value;
        saveNavigationState();
        history.pushState({ classification: selectedClassification }, '', `#${slugify(selectedClassification)}`);
        renderAll();
    });

    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            sections = data.sections || ["Miscellaneous"];
            classifications = (data.classifications || [{ name: "Miscellaneous", section: "Miscellaneous", columns: 1 }]).map(ch => ({
                ...ch,
                columns: ch.columns || 1
            }));
            examples = data.examples || [];

            const hash = window.location.hash.replace('#', '');
            let hashMatched = false;
            if (hash) {
                const matchedClass = classifications.find(ch => slugify(ch.name) === hash);
                if (matchedClass) {
                    selectedClassification = matchedClass.name;
                    selectedSection = matchedClass.section;
                    hashMatched = true;
                }
            }

            if (!hashMatched) {
                const savedSection = localStorage.getItem('stocks_selected_section');
                const savedClassification = localStorage.getItem('stocks_selected_classification');
                if (savedSection) selectedSection = savedSection;
                if (savedClassification) selectedClassification = savedClassification;
            }

            const activeExamples = getFilteredExamples();
            const visibleSections = sections.filter(sec => {
                const secClassifications = classifications.filter(ch => ch.section === sec);
                return secClassifications.some(ch => activeExamples.some(link => link.classification === ch.name));
            });

            if (!visibleSections.includes(selectedSection)) {
                selectedSection = visibleSections[0] || sections[0] || "Miscellaneous";
            }

            const visibleClassifications = classifications.filter(ch => 
                ch.section === selectedSection && activeExamples.some(link => link.classification === ch.name)
            );

            if (!visibleClassifications.some(ch => ch.name === selectedClassification)) {
                selectedClassification = visibleClassifications[0] ? visibleClassifications[0].name : "";
            }

            saveNavigationState();
            renderAll();
        }
    });

    topicSearchInput.addEventListener('input', (e) => {
        topicSearchQuery = e.target.value;
        
        const activeExamples = getFilteredExamples();
        const availableClassifications = classifications.filter(ch => 
            activeExamples.some(link => link.classification === ch.name)
        );
        
        if (!availableClassifications.some(ch => ch.name === selectedClassification)) {
            selectedClassification = availableClassifications[0] ? availableClassifications[0].name : "";
        }
        
        if (selectedClassification) {
            const currentChObj = classifications.find(ch => ch.name === selectedClassification);
            if (currentChObj) selectedSection = currentChObj.section;
        }

        saveNavigationState();
        renderAll();
    });

    clearSearchBtn.addEventListener('click', () => {
        topicSearchQuery = "";
        topicSearchInput.value = "";

        const activeExamples = getFilteredExamples();
        const availableClassifications = classifications.filter(ch => 
            activeExamples.some(link => link.classification === ch.name)
        );
        
        if (!availableClassifications.some(ch => ch.name === selectedClassification)) {
            selectedClassification = availableClassifications[0] ? availableClassifications[0].name : "";
        }
        
        if (selectedClassification) {
            const currentChObj = classifications.find(ch => ch.name === selectedClassification);
            if (currentChObj) selectedSection = currentChObj.section;
        }

        saveNavigationState();
        renderAll();
    });

    function closeModal() {
        if (settingsModalOverlay.style.display === 'flex') {
            document.body.classList.remove('modal-open');
            if (location.hash === '#settings') {
                history.back();
            } else {
                settingsModalOverlay.style.display = 'none';
            }
        }
    }

    closeSettingsModalBtn.addEventListener('click', closeModal);
    window.addEventListener('click', (e) => {
        if (e.target === settingsModalOverlay) closeModal();
    });

    const settingsBtnDesktop = document.getElementById('settings-btn-desktop');
    const settingsBtnMobile = document.getElementById('settings-btn-mobile');

    function openSettingsModal() {
        document.body.classList.add('modal-open');
        settingsModalOverlay.style.display = 'flex';
        history.pushState({ modalOpen: true }, '', '#settings');
    }

    if (settingsBtnDesktop) settingsBtnDesktop.addEventListener('click', openSettingsModal);
    if (settingsBtnMobile) settingsBtnMobile.addEventListener('click', openSettingsModal);

    function renderAll() {
        renderSectionList();
        renderClassificationList();
        renderMainExamples();
        updateContainerWidth();
    }

    function getFilteredExamples() {
        let result = examples;

        if (topicSearchQuery.trim() !== '') {
            const query = topicSearchQuery.toLowerCase().trim();
            result = result.filter(item => {
                const textMatches = item.text && item.text.toLowerCase().includes(query);
                const classMatches = item.classification && item.classification.toLowerCase().includes(query);
                const urlMatches = item.url && item.url.toLowerCase().includes(query);
                return textMatches || classMatches || urlMatches;
            });
        }

        return result;
    }

    function renderSectionList() {
        const sectionList = document.getElementById('section-list');
        const classificationsContainer = document.getElementById('classifications-container');
        sectionList.innerHTML = '';
        sectionSelect.innerHTML = '';

        classificationsContainer.classList.remove('hidden-container');

        const activeExamples = getFilteredExamples();
        const visibleSections = sections.filter(sec => {
            const secClassifications = classifications.filter(ch => ch.section === sec);
            return secClassifications.some(ch => activeExamples.some(link => link.classification === ch.name));
        });

        visibleSections.forEach(sec => {
            const link = document.createElement('a');
            link.textContent = sec;
            link.href = '#';
            link.className = `list-item ${sec === selectedSection ? 'active' : ''}`;
            link.onclick = (e) => {
                e.preventDefault();
                selectedSection = sec;
                const visibleChs = classifications.filter(ch => 
                    ch.section === selectedSection && activeExamples.some(link => link.classification === ch.name)
                );
                selectedClassification = visibleChs[0] ? visibleChs[0].name : "";
                saveNavigationState();
                renderAll();
            };
            sectionList.appendChild(link);

            const option = document.createElement('option');
            option.value = sec;
            option.textContent = sec;
            if (sec === selectedSection) option.selected = true;
            sectionSelect.appendChild(option);
        });
    }

    function renderClassificationList() {
        const classificationList = document.getElementById('classification-list');
        classificationList.innerHTML = '';
        classificationSelect.innerHTML = '';

        const activeExamples = getFilteredExamples();
        const visibleClassifications = classifications.filter(ch => 
            ch.section === selectedSection && activeExamples.some(link => link.classification === ch.name)
        );

        visibleClassifications.forEach(chObj => {
            const count = examples.filter(item => item.classification === chObj.name).length;

            const link = document.createElement('a');
            link.textContent = `${chObj.name} (${count})`;
            link.href = '#';
            link.className = `list-item ${chObj.name === selectedClassification ? 'active' : ''}`;
            link.onclick = (e) => {
                e.preventDefault();
                selectedClassification = chObj.name;
                saveNavigationState();
                history.pushState({ classification: chObj.name }, '', `#${slugify(chObj.name)}`);
                renderAll();
            };
            classificationList.appendChild(link);

            const option = document.createElement('option');
            option.value = chObj.name;
            option.textContent = `${chObj.name} (${count})`;
            if (chObj.name === selectedClassification) option.selected = true;
            classificationSelect.appendChild(option);
        });
    }

    function renderMainExamples() {
        exampleList.innerHTML = '';
        
        let headerText = selectedClassification ? `Examples : ${selectedClassification}` : "No Classification Selected";
        document.getElementById('current-classification-title').textContent = headerText;

        if (!selectedClassification) return;

        const currentClassObj = classifications.find(ch => ch.name === selectedClassification);
        const colCount = currentClassObj && currentClassObj.columns ? currentClassObj.columns : 1;

        if (colCount > 1) {
            exampleList.style.display = 'block';
            exampleList.style.columnCount = colCount;
            exampleList.style.columnGap = '40px';
        } else {
            exampleList.style.display = 'flex';
            exampleList.style.flexDirection = 'column';
            exampleList.style.alignItems = 'flex-start';
            exampleList.style.gap = '20px';
            exampleList.style.columnCount = '';
            exampleList.style.columnGap = '';
        }

        let filtered = getFilteredExamples().filter(item => item.classification === selectedClassification);

        filtered.forEach(item => {
            const hasUrl = item.url && item.url.trim() !== '';
            
            if (hasUrl) {
                const anchor = document.createElement('a');
                anchor.href = item.url.match(/^https?:\/\//i) ? item.url : 'https://' + item.url;
                anchor.textContent = item.text;
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                anchor.style.color = '#0000ee';
                if (colCount > 1) {
                    anchor.style.display = 'block';
                    anchor.style.marginBottom = '20px';
                    anchor.style.breakInside = 'avoid';
                }
                exampleList.appendChild(anchor);
            } else {
                const span = document.createElement('span');
                span.className = 'example-text';
                span.textContent = item.text;
                span.style.color = '#000000';
                if (colCount > 1) {
                    span.style.display = 'block';
                    span.style.marginBottom = '20px';
                    span.style.breakInside = 'avoid';
                }
                exampleList.appendChild(span);
            }
        });
    }

    window.addEventListener('resize', () => {
        updateContainerWidth();
    });

    function updateContainerWidth() {
        const classificationsContainer = document.getElementById('classifications-container');

        if (window.innerWidth <= 768) {
            if (classificationsContainer) classificationsContainer.style.minWidth = '';
            return;
        }

        const measurer = document.createElement('span');
        measurer.style.visibility = 'hidden';
        measurer.style.position = 'absolute';
        measurer.style.whiteSpace = 'nowrap';
        document.body.appendChild(measurer);

        if (classificationsContainer) {
            if (!classifications.length) {
                classificationsContainer.style.minWidth = '';
            } else {
                let maxClassWidth = 0;
                measurer.style.font = window.getComputedStyle(document.body).font;
                classifications.forEach(ch => {
                    measurer.textContent = ch.name;
                    const width = measurer.getBoundingClientRect().width;
                    if (width > maxClassWidth) maxClassWidth = width;
                });
                classificationsContainer.style.minWidth = `${Math.ceil(maxClassWidth) + 60}px`;
            }
        }

        document.body.removeChild(measurer);
    }
</script>
</body>
</html>
