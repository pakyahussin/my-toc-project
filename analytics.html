<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Analytics - PakyaNotes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .analytics-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .analytics-table th, .analytics-table td {
            border: 1px solid #ddd;
            padding: 10px 14px;
            text-align: center;
        }

        .analytics-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .analytics-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .login-box h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-align: center;
        }

        .login-box input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-box button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .logout-btn {
            background-color: #757575;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 14px;
            cursor: pointer;
        }

        #auth-error {
            color: red;
            font-size: 12px;
            margin: 0;
            display: none;
        }

        .total-row {
            font-weight: bold;
            background-color: #e2e8f0 !important;
        }
    </style>
</head>
<body>

<!-- Login Modal -->
<div class="login-overlay" id="login-overlay" style="display: flex;">
    <div class="login-box">
        <h2>Analytics Admin Login</h2>
        <input type="email" id="login-email" placeholder="Email" autocomplete="username">
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
        <button id="login-btn">Sign In</button>
        <p id="auth-error"></p>
    </div>
</div>

<!-- Main App Layout -->
<div id="admin-app" style="display: none; width: 100%; max-width: 800px;">
    <div class="header-bar">
        <span><strong>Visitor Analytics</strong> (Malaysia Time UTC+8)</span>
        <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>

    <div class="container">
        <table class="analytics-table">
            <thead>
                <tr>
                    <th style="text-align: left;">Date</th>
                    <th>Desktop</th>
                    <th>Phone</th>
                    <th>Tablet</th>
                    <th>Total Unique</th>
                </tr>
            </thead>
            <tbody id="analytics-tbody">
                <tr>
                    <td colspan="5">Loading analytics data...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { 
        initializeFirestore, 
        persistentLocalCache, 
        persistentMultipleTabManager, 
        collection, 
        onSnapshot,
        query,
        orderBy
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBgDtEmsmmglLcx6BbzR-IfFZ31duTPOag",
        authDomain: "toc-app-3ffe0.firebaseapp.com",
        projectId: "toc-app-3ffe0",
        storageBucket: "toc-app-3ffe0.firebasestorage.app",
        messagingSenderId: "1047075984315",
        appId: "1:1047075984315:web:8ddf68765cbef4efb2ea9e",
        measurementId: "G-H7677BPJ4G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, {
        localCache: persistentLocalCache({
            tabManager: persistentMultipleTabManager()
        })
    });

    const loginOverlay = document.getElementById('login-overlay');
    const adminApp = document.getElementById('admin-app');
    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const authError = document.getElementById('auth-error');
    const tbody = document.getElementById('analytics-tbody');

    // --- Authentication Flow ---
    loginBtn.addEventListener('click', async () => {
        const email = loginEmailInput.value.trim();
        const password = loginPasswordInput.value.trim();
        authError.style.display = 'none';

        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            authError.textContent = "Invalid credentials.";
            authError.style.display = 'block';
        }
    });

    logoutBtn.addEventListener('click', () => {
        signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginOverlay.style.display = 'none';
            adminApp.style.display = 'block';
            loadAnalytics();
        } else {
            loginOverlay.style.display = 'flex';
            adminApp.style.display = 'none';
        }
    });

    // Helper: Format YYYY-MM-DD into "DD MMM YYYY" (e.g., 30 Sep 2026)
    function formatDateString(dateStr) {
        const [year, month, day] = dateStr.split('-');
        const dateObj = new Date(year, month - 1, day);
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${String(day).padStart(2, '0')} ${months[dateObj.getMonth()]} ${year}`;
    }

    // --- Real-time Analytics Listener ---
    function loadAnalytics() {
        const q = query(collection(db, "analytics_daily"), orderBy("dateStr", "desc"));

        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="5">No analytics recorded yet.</td></tr>';
                return;
            }

            tbody.innerHTML = '';

            let grandDesktop = 0;
            let grandPhone = 0;
            let grandTablet = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const desktop = data.desktop || 0;
                const phone = data.phone || 0;
                const tablet = data.tablet || 0;
                const total = desktop + phone + tablet;

                grandDesktop += desktop;
                grandPhone += phone;
                grandTablet += tablet;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: left;">${formatDateString(data.dateStr)}</td>
                    <td>${desktop}</td>
                    <td>${phone}</td>
                    <td>${tablet}</td>
                    <td><strong>${total}</strong></td>
                `;
                tbody.appendChild(tr);
            });

            // Summary row at the top
            const totalRow = document.createElement('tr');
            totalRow.className = 'total-row';
            totalRow.innerHTML = `
                <td style="text-align: left;">All Time Total</td>
                <td>${grandDesktop}</td>
                <td>${grandPhone}</td>
                <td>${grandTablet}</td>
                <td><strong>${grandDesktop + grandPhone + grandTablet}</strong></td>
            `;
            tbody.insertBefore(totalRow, tbody.firstChild);
        });
    }
</script>
</body>
</html>
