<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Shariah Status - Admin</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            overflow-x: auto;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .login-box h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }
        .login-box input { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .login-box button, .header-bar button { background-color: #2196F3; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        #auth-error { color: red; font-size: 12px; margin: 0; display: none; }

        .header-bar {
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: max-content;
        }
        .container {
            text-align: center; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); width: 100%; box-sizing: border-box;
        }
        .table-container {
            background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); width: 100%; box-sizing: border-box;
        }
        label { font-size: 18px; font-weight: 500; margin-right: 10px; }
        input[type="text"] {
            padding: 8px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; outline: none; width: 160px; text-transform: lowercase;
        }
        button {
            padding: 8px 16px; font-size: 16px; font-weight: 500; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 8px;
        }
        button:hover { background-color: #0056b3; }
        table { border-collapse: collapse; width: 100%; text-align: center; font-size: 14px; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; }
        th { background-color: #f4f4f4; font-weight: 600; cursor: pointer; user-select: none; }
        th:hover { background-color: #eaeaea; }
        .stock-link { color: #000000; font-weight: bold; text-decoration: none; cursor: pointer; }
        .stock-link:hover { text-decoration: underline; color: #007bff; }
        .status-cell { cursor: pointer; user-select: none; font-weight: 500; }
        .status-shariah { color: #28a745; background-color: #e6f9ec; }
        .status-non-shariah { color: #dc3545; background-color: #fde8e8; }
        .status-na { color: #000000; background-color: #f9f9f9; }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div class="modal-overlay" id="login-overlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="email" id="login-email" placeholder="Email" autocomplete="username">
            <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
            <button id="login-btn">Sign In</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- Admin App Content -->
    <div id="admin-app" style="display: none; flex-direction: column; align-items: center;">
        <div class="header-bar">
            <span>Logged in as Admin</span>
            <button id="logout-btn" style="background-color: #757575;">Log Out</button>
        </div>

        <div class="main-container">
            <div class="container">
                <form id="stockForm" onsubmit="searchStock(event)">
                    <label for="stockInput">Find Stock :</label>
                    <input type="text" id="stockInput" autocomplete="off" required oninput="filterTable()">
                    <button type="submit">OK</button>
                </form>
            </div>

            <div class="container" style="padding: 15px 30px;">
                <label for="shariahThreshold">Consider shariah if</label>
                <select id="shariahThreshold" onchange="updateThreshold()">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <span style="font-size: 18px; font-weight: 500; margin-left: 10px;">/ 5 shariah compliant</span>
            </div>

            <div class="table-container">
                <table id="stockTable">
                    <thead>
                        <tr>
                            <th onclick="sortTable('name')">Name of Stock <span id="sortNameIcon"></span></th>
                            <th onclick="sortTable('date')">Date & Time <span id="sortDateIcon"></span></th>
                            <th>Islamicly</th>
                            <th>Zoya</th>
                            <th>Musaffa</th>
                            <th>MuslimXChange</th>
                            <th>SP-Funds.Com</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated from Firebase -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgDtEmsmmglLcx6BbzR-IfFZ31duTPOag",
            authDomain: "toc-app-3ffe0.firebaseapp.com",
            projectId: "toc-app-3ffe0",
            storageBucket: "toc-app-3ffe0.firebasestorage.app",
            messagingSenderId: "1047075984315",
            appId: "1:1047075984315:web:8ddf68765cbef4efb2ea9e",
            measurementId: "G-H7677BPJ4G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });
        const stockDocRef = doc(db, "app_data", "shariah_stocks");

        let globalStocks = [];
        let currentSort = JSON.parse(localStorage.getItem('adminStockSortState')) || { column: 'date', direction: 'desc' };
        
        let savedThreshold = localStorage.getItem('shariahThreshold') || '3';
        document.getElementById('shariahThreshold').value = savedThreshold;

        window.updateThreshold = function() {
            let val = document.getElementById('shariahThreshold').value;
            localStorage.setItem('shariahThreshold', val);
            renderAndFilterTable();
        }

        // Auth handlers
        const loginOverlay = document.getElementById('login-overlay');
        const adminApp = document.getElementById('admin-app');
        const authError = document.getElementById('auth-error');

        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            authError.style.display = 'none';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                authError.textContent = "Invalid login credentials.";
                authError.style.display = 'block';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginOverlay.style.display = 'none';
                adminApp.style.display = 'flex';
            } else {
                loginOverlay.style.display = 'flex';
                adminApp.style.display = 'none';
            }
        });

        window.searchStock = function(event) {
            event.preventDefault();
            let ticker = document.getElementById('stockInput').value.trim();
            if (!ticker) return;

            let upperTicker = ticker.toUpperCase();
            openStockLinks(ticker);

            if (!globalStocks.some(s => s.ticker === upperTicker)) {
                let now = new Date();
                globalStocks.unshift({
                    ticker: upperTicker,
                    dateTime: now.toLocaleString(),
                    islamicly: 0,
                    zoya: 0,
                    musaffa: 0,
                    muslimXChange: 0,
                    spFunds: 0
                });
                saveToFirebase();
            }

            document.getElementById('stockInput').value = '';
            filterTable();
        }

        window.openStockLinks = function(ticker) {
            let lowerTicker = ticker.toLowerCase();
            let upperTicker = ticker.toUpperCase();
            let urls = [
                `https://islamicly.com/Web/Universe/X?ticker=${lowerTicker}`,
                `https://zoya.finance/stocks/${lowerTicker}`,
                `https://musaffa.com/stock/${upperTicker}/`,
                `https://muslimxchange.com/ticker/${lowerTicker}/`,
                `https://spscreener.mxcorporate.com/ticker/${lowerTicker}`
            ];
            urls.forEach(url => window.open(url, '_blank'));
        }

        window.sortTable = function(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }
            localStorage.setItem('adminStockSortState', JSON.stringify(currentSort));
            renderAndFilterTable();
        }

        window.filterTable = function() {
            renderAndFilterTable();
        }

        function saveToFirebase() {
            setDoc(stockDocRef, { stocks: globalStocks }, { merge: true }).catch(err => {
                console.error("Error saving to Firebase:", err);
            });
        }

        onSnapshot(stockDocRef, (docSnap) => {
            if (docSnap.exists()) {
                globalStocks = docSnap.data().stocks || [];
            } else {
                globalStocks = [];
            }
            renderAndFilterTable();
        });

        function renderAndFilterTable() {
            let query = document.getElementById('stockInput').value.trim().toLowerCase();
            let filtered = globalStocks.filter(item => item.ticker.toLowerCase().includes(query));
            
            if (filtered.length === 0 && query !== '') {
                filtered = [...globalStocks];
            }

            filtered.sort((a, b) => {
                let valA, valB;
                if (currentSort.column === 'name') {
                    valA = a.ticker.toLowerCase();
                    valB = b.ticker.toLowerCase();
                    if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                    return 0;
                } else if (currentSort.column === 'date') {
                    valA = new Date(a.dateTime || 0).getTime();
                    valB = new Date(b.dateTime || 0).getTime();
                    if (isNaN(valA) || isNaN(valB)) {
                        valA = a.dateTime || '';
                        valB = b.dateTime || '';
                    }
                    if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                    return 0;
                }
                return 0;
            });

            renderTable(filtered);
            updateSortIndicators();
        }

        function renderTable(stocks) {
            let tbody = document.querySelector('#stockTable tbody');
            tbody.innerHTML = '';

            let threshold = parseInt(document.getElementById('shariahThreshold').value, 10);

            stocks.forEach((item) => {
                let row = tbody.insertRow();
                let cellStock = row.insertCell(0);
                let cellDateTime = row.insertCell(1);

                let statuses = [item.islamicly, item.zoya, item.musaffa, item.muslimXChange, item.spFunds];
                let shariahCount = statuses.filter(val => val === 1).length;
                let complianceClass = shariahCount >= threshold ? 'status-shariah' : 'status-non-shariah';

                cellStock.className = `status-cell ${complianceClass}`;
                cellDateTime.className = `status-cell ${complianceClass}`;

                cellStock.innerHTML = `<a class="stock-link" onclick="openStockLinks('${item.ticker}')">${item.ticker}</a>`;
                cellDateTime.textContent = item.dateTime;

                let keys = ['islamicly', 'zoya', 'musaffa', 'muslimXChange', 'spFunds'];
                keys.forEach((key, kidx) => {
                    let cell = row.insertCell(kidx + 2);
                    let val = item[key] || 0;
                    cell.className = `status-cell ${getStatusClass(val)}`;
                    cell.textContent = getStatusText(val);

                    cell.addEventListener('click', function() {
                        item[key] = (val + 1) % 3;
                        saveToFirebase();
                    });
                });
            });
        }

        function updateSortIndicators() {
            document.getElementById('sortNameIcon').textContent = '';
            document.getElementById('sortDateIcon').textContent = '';

            let icon = currentSort.direction === 'asc' ? ' ▲' : ' ▼';
            if (currentSort.column === 'name') {
                document.getElementById('sortNameIcon').textContent = icon;
            } else if (currentSort.column === 'date') {
                document.getElementById('sortDateIcon').textContent = icon;
            }
        }

        function getStatusText(val) {
            if (val === 1) return 'Shariah';
            if (val === 2) return 'Non-Shariah';
            return 'N/A';
        }

        function getStatusClass(val) {
            if (val === 1) return 'status-shariah';
            if (val === 2) return 'status-non-shariah';
            return 'status-na';
        }
    </script>
</body>
</html>
