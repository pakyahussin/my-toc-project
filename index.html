<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakyaNotes - Contents</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            color: #000000;
            display: flex;
            justify-content: center;

        .main-layout {
            display: flex;

        }

        .content-container {
            width: max-content;
            background-color: #ffffff;
            padding: 20px;
            box-sizing: border-box;

            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-height: 80vh;
        }

        .list-item {
            font-size: 14px;
            color: #0000ee;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font-weight: normal;
            white-space: nowrap;

            background-color: #fff;

        .content-container h3 {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #current-chapter-title {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #link-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        a {
            font-size: 14px;
            color: #0000ee;
            text-decoration: none;
            text-align: left;
            white-space: nowrap;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Settings Button & Modal Styles */
.settings-btn {
    margin-top: 60px;
    padding: 6px 12px;
    font-size: 13px;
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
}

.settings-btn:hover {
    background-color: #e0e0e0;
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
    width: 280px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.modal-header h3 {
    margin: 0;
}

.close-btn {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
}

.settings-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.settings-options label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 14px;
}

.section-header-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section-header-row h3 {
    margin: 0;
}

/* Desktop default: Show desktop button (60px margin), hide mobile button */
.desktop-only {
    display: inline-block;
    margin-top: 60px;
}

.mobile-only {
    display: none;
}

/* Visited link styling (Purple + Strikethrough) */
#link-list a.visited {
    color: purple !important;
    text-decoration: line-through !important;
}

/* Stats Section inside Settings Modal */
.stats-container {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
    font-size: 13px;
    line-height: 1.6;
}

.stats-container strong {
    font-size: 14px;
    display: block;
    margin-bottom: 6px;
}

.reset-visited-btn {
    margin-top: -20px;
    padding: 6px 10px;
    font-size: 12px;
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
}

.reset-visited-btn:hover {
    background-color: #e0e0e0;
}

        /* Mobile Styles */
        @media (max-width: 768px) {
            body {
                padding: 12px;
                font-size: 16px;
            }

            .main-layout {
                flex-direction: column;
                width: 100%;
                gap: 16px;
            }

            .content-container {
                width: 100% !important;
                min-height: auto;
                padding: 16px;
            }

            .right-container {
                min-width: unset !important;
            }

            #section-list, #chapter-list {
                display: none;
            }

            .dropdown-select {
                display: block;
            }

            #link-list {
                gap: 12px;
            }

            #link-list a {
                font-size: 16px;
                white-space: normal;
                word-break: break-word;
                padding: 10px 12px;
                background-color: #f8f9fa;
                border-radius: 6px;
                border: 1px solid #e2e8f0;
                width: 100%;
                box-sizing: border-box;
                display: block;
            }

            #link-list a:active {
                background-color: #e2e8f0;
            }

.section-header-row {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: center !important;
        width: 100% !important;
        margin-bottom: 12px;
    }

    /* Remove bottom margin on h3 so it aligns vertically with the button */
    .section-header-row h3 {
        margin: 0 !important;
    }

    .desktop-only {
        display: none !important;
    }

    .mobile-only {
        display: inline-block !important;
        margin-top: 0 !important; /* Clears top margin on mobile */
        padding: 5px 12px;
    }

        }
    </style>
</head>
<body>

<div class="main-layout">
<!-- Sections Container -->
<div class="content-container">
    <div class="section-header-row">
        <h3>Sections</h3>
        <button id="settings-btn-mobile" class="settings-btn mobile-only">Settings</button>

    <!-- Chapters Container -->

</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Settings</h3>
            <button class="close-btn" id="close-settings-modal-btn">&times;</button>
        </div>
        <div class="settings-options">
            <label>
                <input type="radio" name="formatFilter" value="all" checked>
                show videos & notes

            <label>
                <input type="radio" name="formatFilter" value="Video">
                show videos only
            </label>
            <label>
                <input type="radio" name="formatFilter" value="Notes">
                show notes only

            <br>

            <label>
                <input type="checkbox" id="public-posts-only-checkbox">
                show public posts only
            </label>
        </div>

        <!-- Stats Section -->
        <div class="stats-container">
            <strong>Stats</strong>
            <div id="stats-total">Total links : 0</div>
            <br>
            <div id="stats-videos">Videos : 0 ( 0.0 % )</div>
            <div id="stats-notes">Notes : 0 ( 0.0 % )</div>
            <div id="stats-unassigned">Unassigned : 0 ( 0.0 % )</div>
            <br>
            <div id="stats-visited">Visited : 0 ( 0.0 % )</div>
            <div id="stats-unvisited">Unvisited : 0 ( 0.0 % )</div>
            <br>
            <button id="reset-visited-btn" class="reset-visited-btn">Reset all visited links</button>
            <br><br>
            <div id="stats-subs-only">Subs-only posts : 0 ( 0.0 % )</div>
            <div id="stats-public">Public posts : 0 ( 0.0 % )</div>
            <br>
            <a href="https://pakyanotes.com/join" target="_blank" rel="noopener noreferrer">How to subscribe ?</a>

    </div>
</div>

<!-- Firebase SDK Imports -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        initializeFirestore, 
        persistentLocalCache, 
        persistentMultipleTabManager, 
        doc, 
        getDoc, 
        setDoc, 
        updateDoc, 
        arrayUnion, 
        increment, 
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBgDtEmsmmglLcx6BbzR-IfFZ31duTPOag",
        authDomain: "toc-app-3ffe0.firebaseapp.com",
        projectId: "toc-app-3ffe0",
        storageBucket: "toc-app-3ffe0.firebasestorage.app",
        messagingSenderId: "1047075984315",
        appId: "1:1047075984315:web:8ddf68765cbef4efb2ea9e",
        measurementId: "G-H7677BPJ4G"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
        localCache: persistentLocalCache({
            tabManager: persistentMultipleTabManager()
        })
    });
    const docRef = doc(db, "app_data", "main_state");

    let sections = ["Miscellaneous"];
    let chapters = [{ name: "Miscellaneous", section: "Miscellaneous" }];
    let links = [];

    let selectedSection = "Miscellaneous";
    let selectedChapter = "Miscellaneous";

    const linkList = document.getElementById('link-list');
    const sectionSelect = document.getElementById('section-select');
    const chapterSelect = document.getElementById('chapter-select');

    let selectedFilter = 'all'; // 'all', 'Video', or 'Notes'
let showPublicOnly = false; // default: off

const publicPostsCheckbox = document.getElementById('public-posts-only-checkbox');

publicPostsCheckbox.addEventListener('change', (e) => {
    showPublicOnly = e.target.checked;
    
    // Re-validate current selections against visible topics
    const activeTopics = getFilteredTopics();
    const availableChapters = chapters.filter(ch => 
        activeTopics.some(link => link.chapter === ch.name)
    );
    
    if (!availableChapters.some(ch => ch.name === selectedChapter)) {
        selectedChapter = availableChapters[0] ? availableChapters[0].name : "";
    }
    
    if (selectedChapter) {
        const currentChObj = chapters.find(ch => ch.name === selectedChapter);
        if (currentChObj) selectedSection = currentChObj.section;
    }

    renderAll();
});

    const settingsModalOverlay = document.getElementById('settings-modal-overlay');
    const closeSettingsModalBtn = document.getElementById('close-settings-modal-btn');
    const filterRadioButtons = document.querySelectorAll('input[name="formatFilter"]');

sectionSelect.addEventListener('change', (e) => {
    selectedSection = e.target.value;
    const activeTopics = getFilteredTopics();
    const availableChapters = chapters.filter(ch => 
        ch.section === selectedSection && activeTopics.some(link => link.chapter === ch.name)
    );
    selectedChapter = availableChapters[0] ? availableChapters[0].name : "";
    renderAll();
});

    chapterSelect.addEventListener('change', (e) => {
        selectedChapter = e.target.value;
        renderAll();
    });

    window.addEventListener('resize', () => {
        updateContainerWidth();
    });

    // Real-time synchronization listener (Read-Only)
    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            sections = data.sections || ["Miscellaneous"];
            
            // Backwards compatibility migration for string chapters
            if (data.chapters && typeof data.chapters[0] === 'string') {
                chapters = data.chapters.map(ch => ({ name: ch, section: "Miscellaneous" }));
            } else {
                chapters = data.chapters || [{ name: "Miscellaneous", section: "Miscellaneous" }];
            }

            links = data.links || [];

            if (!sections.includes(selectedSection)) {
                selectedSection = sections[0] || "Miscellaneous";
            }

            const availableChapters = chapters.filter(ch => ch.section === selectedSection);
            if (!availableChapters.some(ch => ch.name === selectedChapter)) {
                selectedChapter = availableChapters[0] ? availableChapters[0].name : "";
            }

            renderAll();
        }
    });

function closeModal() {
    if (settingsModalOverlay.style.display === 'flex') {
        if (location.hash === '#settings') {
            history.back(); // Pops the history state pushed during openSettingsModal
        } else {
            settingsModalOverlay.style.display = 'none';
        }
    }
}

// Update close button & click outside listeners to use closeModal
closeSettingsModalBtn.addEventListener('click', closeModal);

window.addEventListener('click', (e) => {
    if (e.target === settingsModalOverlay) {
        closeModal();
    }
});

window.addEventListener('popstate', () => {
    // Whenever history goes back (via back button OR closeModal), hide overlay
    settingsModalOverlay.style.display = 'none';
});

const settingsBtnDesktop = document.getElementById('settings-btn-desktop');
const settingsBtnMobile = document.getElementById('settings-btn-mobile');

// Open modal on click for either button
function openSettingsModal() {
    settingsModalOverlay.style.display = 'flex';
    // Push state so hitting back button triggers 'popstate' instead of leaving page
    history.pushState({ modalOpen: true }, '', '#settings');
}

if (settingsBtnDesktop) {
    settingsBtnDesktop.addEventListener('click', openSettingsModal);
}

if (settingsBtnMobile) {
    settingsBtnMobile.addEventListener('click', openSettingsModal);
}

    function renderAll() {
        renderSectionList();
        renderChapterList();
        renderMainLinks();
        updateContainerWidth();
        renderStats();
    }

// Helper to get visible topics based on format filter AND public posts filter
function getFilteredTopics() {
    let result = links;

    if (selectedFilter !== 'all') {
        result = result.filter(item => item.format === selectedFilter);
    }

    if (showPublicOnly) {
        result = result.filter(item => item.color === 'red');
    }

    return result;
}

// Update radio button listener to re-evaluate available sections/chapters when filter changes
filterRadioButtons.forEach(radio => {
    radio.addEventListener('change', (e) => {
        selectedFilter = e.target.value;
        
        // Re-validate current selections against visible topics
        const activeTopics = getFilteredTopics();
        const availableChapters = chapters.filter(ch => 
            activeTopics.some(link => link.chapter === ch.name)
        );
        
        if (!availableChapters.some(ch => ch.name === selectedChapter)) {
            selectedChapter = availableChapters[0] ? availableChapters[0].name : "";
        }
        
        if (selectedChapter) {
            const currentChObj = chapters.find(ch => ch.name === selectedChapter);
            if (currentChObj) selectedSection = currentChObj.section;
        }

        renderAll();
    });
});

function renderSectionList() {
    const sectionList = document.getElementById('section-list');
    sectionList.innerHTML = '';
    sectionSelect.innerHTML = '';

    const activeTopics = getFilteredTopics();

    // Filter sections to only those having chapters with matching topics
    const visibleSections = sections.filter(sec => {
        const secChapters = chapters.filter(ch => ch.section === sec);
        return secChapters.some(ch => activeTopics.some(link => link.chapter === ch.name));
    });

    visibleSections.forEach(sec => {
        // Desktop Links
        const link = document.createElement('a');
        link.textContent = sec;
        link.href = '#';
        link.className = `list-item ${sec === selectedSection ? 'active' : ''}`;
        link.onclick = (e) => {
            e.preventDefault();
            selectedSection = sec;

            const visibleChs = chapters.filter(ch => 
                ch.section === selectedSection && activeTopics.some(link => link.chapter === ch.name)
            );
            selectedChapter = visibleChs[0] ? visibleChs[0].name : "";
            renderAll();
        };
        sectionList.appendChild(link);

        // Mobile Dropdown Option
        const option = document.createElement('option');
        option.value = sec;
        option.textContent = sec;
        if (sec === selectedSection) option.selected = true;
        sectionSelect.appendChild(option);
    });
}

function renderChapterList() {
    const chapterList = document.getElementById('chapter-list');
    chapterList.innerHTML = '';
    chapterSelect.innerHTML = '';

    const activeTopics = getFilteredTopics();

    // Filter chapters under current section that have matching topics
    const visibleChapters = chapters.filter(ch => 
        ch.section === selectedSection && activeTopics.some(link => link.chapter === ch.name)
    );

    visibleChapters.forEach(chObj => {
        // Desktop Links
        const link = document.createElement('a');
        link.textContent = chObj.name;
        link.href = '#';
        link.className = `list-item ${chObj.name === selectedChapter ? 'active' : ''}`;
        link.onclick = (e) => {
            e.preventDefault();
            selectedChapter = chObj.name;
            renderAll();
        };
        chapterList.appendChild(link);

        // Mobile Dropdown Option
        const option = document.createElement('option');
        option.value = chObj.name;
        option.textContent = chObj.name;
        if (chObj.name === selectedChapter) option.selected = true;
        chapterSelect.appendChild(option);
    });
}

// LocalStorage helpers for visited links
function getVisitedLinks() {
    return JSON.parse(localStorage.getItem('visited_links') || '[]');
}

function markAsVisited(url) {
    const visited = getVisitedLinks();
    if (!visited.includes(url)) {
        visited.push(url);
        localStorage.setItem('visited_links', JSON.stringify(visited));
    }
}

function resetVisitedLinks() {
    localStorage.removeItem('visited_links');
    renderAll();
}

// Render Stats
function renderStats() {
    const total = links.length;
    
    let videos = 0;
    let notes = 0;
    let unassigned = 0;
    let publicPosts = 0;
    let subsOnlyPosts = 0;

    links.forEach(item => {
        // Format calculation
        if (item.format === 'Video') {
            videos++;
        } else if (item.format === 'Notes') {
            notes++;
        } else {
            unassigned++;
        }

        // Post access type calculation
        if (item.color === 'red') {
            publicPosts++;
        } else {
            subsOnlyPosts++;
        }
    });

    const visitedList = getVisitedLinks();
    let visitedCount = 0;

    links.forEach(item => {
        if (visitedList.includes(item.url)) {
            visitedCount++;
        }
    });

    const unvisitedCount = total - visitedCount;

    const calcPct = (count) => total > 0 ? ((count / total) * 100).toFixed(1) : "0.0";

    document.getElementById('stats-total').textContent = `Total links : ${total}`;
    document.getElementById('stats-videos').textContent = `Videos : ${videos} ( ${calcPct(videos)} % )`;
    document.getElementById('stats-notes').textContent = `Notes : ${notes} ( ${calcPct(notes)} % )`;
    
    // Conditionally hide Unassigned if count is 0
    const unassignedElem = document.getElementById('stats-unassigned');
    if (unassigned === 0) {
        unassignedElem.style.display = 'none';
    } else {
        unassignedElem.style.display = 'block';
        unassignedElem.textContent = `Unassigned : ${unassigned} ( ${calcPct(unassigned)} % )`;
    }

    document.getElementById('stats-visited').textContent = `Visited : ${visitedCount} ( ${calcPct(visitedCount)} % )`;
    document.getElementById('stats-unvisited').textContent = `Unvisited : ${unvisitedCount} ( ${calcPct(unvisitedCount)} % )`;

    document.getElementById('stats-subs-only').textContent = `Subs-only posts : ${subsOnlyPosts} ( ${calcPct(subsOnlyPosts)} % )`;
    document.getElementById('stats-public').textContent = `Public posts : ${publicPosts} ( ${calcPct(publicPosts)} % )`;
}

// Attach Reset Button Listener
document.getElementById('reset-visited-btn').addEventListener('click', () => {
    resetVisitedLinks();
});

function renderMainLinks() {
    linkList.innerHTML = '';
    
    const headerText = selectedChapter ? `Topics : ${selectedChapter}` : "No Chapter Selected";
    document.getElementById('current-chapter-title').textContent = headerText;

    if (!selectedChapter) return;

    let filtered = links.filter(item => item.chapter === selectedChapter);

    if (selectedFilter !== 'all') {
        filtered = filtered.filter(item => item.format === selectedFilter);
    }

    if (showPublicOnly) {
        filtered = filtered.filter(item => item.color === 'red');
    }

    const visitedSet = new Set(getVisitedLinks());

    filtered.forEach(item => {
        const anchor = document.createElement('a');
        anchor.href = item.url;
        anchor.textContent = item.text;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        
        // Check visited status first (highest priority)
        if (visitedSet.has(item.url)) {
            anchor.classList.add('visited');
        } else if (item.color === 'red') {
            anchor.style.color = 'red';
        }

        // Track click locally
        anchor.addEventListener('click', () => {
            markAsVisited(item.url);
            anchor.classList.add('visited');
            anchor.style.color = ''; // reset inline style so CSS visited color takes precedence
            renderStats();
        });

        linkList.appendChild(anchor);
    });
}

function updateContainerWidth() {
    const rightContainer = document.querySelector('.right-container');
    const chaptersContainer = document.getElementById('chapters-container');

    if (window.innerWidth <= 768) {
        if (rightContainer) rightContainer.style.minWidth = '';
        if (chaptersContainer) chaptersContainer.style.minWidth = '';
        return;
    }

    // Helper measurement span
    const measurer = document.createElement('span');
    measurer.style.visibility = 'hidden';
    measurer.style.position = 'absolute';
    measurer.style.whiteSpace = 'nowrap';
    measurer.style.font = window.getComputedStyle(document.body).font;
    document.body.appendChild(measurer);

    // 1. Calculate Topics width
    if (rightContainer) {
        if (!links.length) {
            rightContainer.style.minWidth = '';
        } else {
            let maxTopicWidth = 0;
            links.forEach(item => {
                measurer.textContent = item.text;
                const width = measurer.getBoundingClientRect().width;
                if (width > maxTopicWidth) maxTopicWidth = width;
            });
            rightContainer.style.minWidth = `${Math.ceil(maxTopicWidth) + 60}px`;
        }
    }

    // 2. Calculate Chapters width
    if (chaptersContainer) {
        if (!chapters.length) {
            chaptersContainer.style.minWidth = '';
        } else {
            let maxChapterWidth = 0;
            chapters.forEach(ch => {
                measurer.textContent = ch.name;
                const width = measurer.getBoundingClientRect().width;
                if (width > maxChapterWidth) maxChapterWidth = width;
            });
            chaptersContainer.style.minWidth = `${Math.ceil(maxChapterWidth) + 60}px`;
        }
    }

    document.body.removeChild(measurer);
}

async function trackVisitor() {
    if (typeof db === 'undefined') return;

    // 1. Bot & Crawler Detection
    const isBot = /bot|googlebot|crawler|spider|robot|crawling|headlesschrome|phantomjs/i.test(navigator.userAgent) || navigator.webdriver;
    if (isBot) return;

    // 2. Identify Device Type
    const ua = navigator.userAgent;
    const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
    const isSmallScreen = window.innerWidth <= 768;

    let deviceType = "desktop";
    if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
        deviceType = "tablet";
    } else if (isMobileUA || isSmallScreen) {
        deviceType = "phone";
    }

    // 3. Persistent Visitor ID (localStorage)
    let visitorId = localStorage.getItem('pn_visitor_id');
    if (!visitorId) {
        visitorId = 'v_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        localStorage.setItem('pn_visitor_id', visitorId);
    }

    // 4. Determine Date in Malaysia Time (UTC+8)
    const now = new Date();
    const formatter = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Kuala_Lumpur',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
    });
    const mytDateStr = formatter.format(now); 

    // Prevent double-tracking on the same client during the same session
    const sessionKey = `pn_tracked_${mytDateStr}`;
    if (sessionStorage.getItem(sessionKey)) return;

    const dailyDocRef = doc(db, "analytics_daily", mytDateStr);

    try {
        // First try to safely update existing document
        await updateDoc(dailyDocRef, {
            unique_visitors: arrayUnion(visitorId),
            [deviceType]: increment(1)
        });
        sessionStorage.setItem(sessionKey, 'true');
    } catch (err) {
        // If document doesn't exist yet, create it with initial counts
        if (err.code === 'not-found') {
            try {
                await setDoc(dailyDocRef, {
                    dateStr: mytDateStr,
                    timestamp: Date.now(),
                    unique_visitors: [visitorId],
                    desktop: deviceType === 'desktop' ? 1 : 0,
                    phone: deviceType === 'phone' ? 1 : 0,
                    tablet: deviceType === 'tablet' ? 1 : 0
                }, { merge: true });
                sessionStorage.setItem(sessionKey, 'true');
            } catch (createErr) {
                console.error("Error creating analytics document:", createErr);
            }
        } else {
            console.error("Analytics tracking error:", err);
        }
    }
}

// Trigger tracking on page load
trackVisitor();

</script>
