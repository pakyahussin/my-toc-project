<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOC Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            color: #000000;
            display: flex;
            justify-content: center;
        }

        .main-layout {
            display: flex;
            gap: 20px;
        }

        .content-container {
            width: max-content;
            background-color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-height: 80vh;
        }

        .chapter-item {
            font-size: 14px;
            color: #0000ee;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font-weight: normal;
            white-space: nowrap;
        }

        .chapter-item:hover {
            color: #0000ee;
            text-decoration: underline;
        }

        .chapter-item.active {
            color: red;
            text-decoration: underline;
            font-weight: normal;
        }

        #chapter-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        .left-container h3 {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #current-chapter-title {
            margin-bottom: 20px;
            margin-top: 0;
        }

        #link-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        a {
            font-size: 14px;
            color: #0000ee;
            text-decoration: none;
            text-align: left;
            white-space: nowrap;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="content-container left-container">
        <h3>Chapters</h3>
        <div id="chapter-list"></div>
    </div>

    <div class="content-container right-container">
        <h3 id="current-chapter-title">Topics</h3>
        <div id="link-list"></div>
    </div>
</div>

<!-- Firebase SDK Imports -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
        initializeFirestore, 
        persistentLocalCache, 
        persistentMultipleTabManager, 
        doc, 
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBgDtEmsmmglLcx6BbzR-IfFZ31duTPOag",
        authDomain: "toc-app-3ffe0.firebaseapp.com",
        projectId: "toc-app-3ffe0",
        storageBucket: "toc-app-3ffe0.firebasestorage.app",
        messagingSenderId: "1047075984315",
        appId: "1:1047075984315:web:8ddf68765cbef4efb2ea9e",
        measurementId: "G-H7677BPJ4G"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
        localCache: persistentLocalCache({
            tabManager: persistentMultipleTabManager()
        })
    });
    const docRef = doc(db, "app_data", "main_state");

    let chapters = ["Miscellaneous"];
    let selectedChapter = chapters[0];
    let links = [];

    const linkList = document.getElementById('link-list');

    // Real-time synchronization listener (Read-Only)
    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            chapters = data.chapters || ["Miscellaneous"];
            links = data.links || [];
            if (!chapters.includes(selectedChapter)) {
                selectedChapter = chapters[0] || "Miscellaneous";
            }
            renderAll();
        }
    });

    function renderAll() {
        renderChapterList();
        renderMainLinks();
        updateContainerWidth();
    }

    function renderChapterList() {
        const chapterList = document.getElementById('chapter-list');
        chapterList.innerHTML = '';

        chapters.forEach(ch => {
            const link = document.createElement('a');
            link.textContent = ch;
            link.href = '#';
            link.className = `chapter-item ${ch === selectedChapter ? 'active' : ''}`;
            link.onclick = (e) => {
                e.preventDefault();
                selectedChapter = ch;
                renderAll();
            };
            chapterList.appendChild(link);
        });
    }

    function renderMainLinks() {
        linkList.innerHTML = '';
        document.getElementById('current-chapter-title').textContent = `${selectedChapter}`;

        const filtered = links.filter(item => item.chapter === selectedChapter);
        filtered.forEach(item => {
            const anchor = document.createElement('a');
            anchor.href = item.url;
            anchor.textContent = item.text;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            linkList.appendChild(anchor);
        });
    }

    function updateContainerWidth() {
        const rightContainer = document.querySelector('.right-container');
        if (!links.length) {
            rightContainer.style.minWidth = '';
            return;
        }

        const measurer = document.createElement('span');
        measurer.style.visibility = 'hidden';
        measurer.style.position = 'absolute';
        measurer.style.whiteSpace = 'nowrap';
        measurer.style.font = window.getComputedStyle(document.querySelector('#link-list') || document.body).font;

        document.body.appendChild(measurer);

        let maxWidth = 0;
        links.forEach(item => {
            measurer.textContent = item.text;
            const width = measurer.getBoundingClientRect().width;
            if (width > maxWidth) {
                maxWidth = width;
            }
        });

        document.body.removeChild(measurer);
        rightContainer.style.minWidth = `${Math.ceil(maxWidth) + 60}px`;
    }
</script>
</body>
</html>
